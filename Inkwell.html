<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell — a quiet markdown editor</title>
<style>
/* ============================================================
   Inkwell — single-file markdown editor
   Themes are pure CSS variables; everything else inherits.
   ============================================================ */
:root{
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --font-text: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --measure: 46rem;
  --radius: 8px;
  --speed: .16s;
}

/* ---------- Themes ---------- */
[data-theme="paper"]{
  --bg:#f7f6f3; --panel:#efeee9; --panel-2:#e8e6e0; --page:#fffefb;
  --ink:#22201c; --ink-soft:#5c574f; --ink-faint:#918a7e;
  --rule:#e0ddd4; --rule-soft:#eae7df;
  --accent:#9a5b34; --accent-soft:#f0e3d8;
  --mark:#fbeaa8; --sel:#dbe6f5;
  --code-bg:#f2f0ea; --code-ink:#3d3a34;
  --shadow: 0 1px 2px rgba(40,35,25,.05), 0 8px 28px rgba(40,35,25,.06);
}
[data-theme="night"]{
  --bg:#16171a; --panel:#1c1e22; --panel-2:#24272c; --page:#1a1c1f;
  --ink:#dcdde0; --ink-soft:#9aa0a8; --ink-faint:#6b727b;
  --rule:#2b2f35; --rule-soft:#23262b;
  --accent:#e0a06a; --accent-soft:#31261d;
  --mark:#5c4a1d; --sel:#2c3b52;
  --code-bg:#202329; --code-ink:#c9ccd1;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
}
[data-theme="sepia"]{
  --bg:#f2e8d8; --panel:#e9dcc6; --panel-2:#e0d0b6; --page:#fbf4e6;
  --ink:#3b2f21; --ink-soft:#6d5c46; --ink-faint:#9b8a72;
  --rule:#ded0b6; --rule-soft:#e8dcc6;
  --accent:#8a5a20; --accent-soft:#f0e0c6;
  --mark:#f3d98b; --sel:#e2d3ae;
  --code-bg:#efe4cd; --code-ink:#4a3d2b;
  --shadow: 0 1px 2px rgba(70,55,30,.06), 0 8px 28px rgba(70,55,30,.08);
}
[data-theme="slate"]{
  --bg:#0f1115; --panel:#151821; --panel-2:#1d2230; --page:#12141a;
  --ink:#e6e9ef; --ink-soft:#98a1b3; --ink-faint:#6a7386;
  --rule:#242a38; --rule-soft:#1c2230;
  --accent:#7aa2f7; --accent-soft:#1b2440;
  --mark:#3a4a20; --sel:#25406b;
  --code-bg:#1a1e28; --code-ink:#c8d0e0;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:14px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
::selection{background:var(--sel)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ---------- App frame ---------- */
#app{display:flex; height:100vh; height:100dvh}

/* ---------- Sidebar ---------- */
#sidebar{
  width:264px; flex:0 0 264px; background:var(--panel);
  border-right:1px solid var(--rule); display:flex; flex-direction:column;
  transition:margin-left var(--speed) ease;
}
body.no-sidebar #sidebar{margin-left:-264px}
.side-head{
  display:flex; align-items:center; gap:8px; padding:14px 14px 10px;
  -webkit-app-region:drag;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.brand small{color:var(--ink-faint);font-weight:400;font-size:11px}
.side-tabs{display:flex;gap:2px;padding:2px;margin:4px 10px 8px;background:var(--panel-2);border-radius:7px}
.side-tabs button{
  flex:1;padding:5px 8px;border-radius:5px;font-size:12px;color:var(--ink-soft);
  transition:background var(--speed),color var(--speed)
}
.side-tabs button.on{background:var(--page);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.side-body{flex:1;overflow:auto;padding:0 8px 12px}
.side-body::-webkit-scrollbar{width:9px}
.side-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px;border:3px solid var(--panel)}
.side-pane{display:none}
.side-pane.on{display:block}

.tree-item,.toc-item{
  display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:5px 8px;border-radius:6px;color:var(--ink-soft);font-size:12.5px;
  line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tree-item:hover,.toc-item:hover{background:var(--panel-2);color:var(--ink)}
.tree-item.on{background:var(--accent-soft);color:var(--ink);font-weight:560}
.tree-item svg,.toc-item svg{flex:0 0 auto;opacity:.6}
.toc-item[data-lvl="1"]{font-weight:600;color:var(--ink)}
.toc-item[data-lvl="2"]{padding-left:18px}
.toc-item[data-lvl="3"]{padding-left:30px}
.toc-item[data-lvl="4"]{padding-left:42px}
.toc-item[data-lvl="5"],.toc-item[data-lvl="6"]{padding-left:54px;font-size:11.5px}
.side-empty{padding:14px 10px;color:var(--ink-faint);font-size:12px;line-height:1.6}
.side-action{
  display:flex;align-items:center;gap:7px;width:100%;padding:7px 9px;margin-top:6px;
  border:1px dashed var(--rule);border-radius:7px;color:var(--ink-soft);font-size:12px
}
.side-action:hover{border-color:var(--accent);color:var(--accent)}
.side-foot{padding:8px;border-top:1px solid var(--rule);display:flex;gap:4px;align-items:center}
.theme-dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);cursor:pointer}
.theme-dot.on{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#toolbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;gap:2px;
  padding:0 8px;border-bottom:1px solid var(--rule);background:var(--panel);
}
.tb{display:flex;align-items:center;gap:2px}
.tb-sep{width:1px;height:18px;background:var(--rule);margin:0 6px}
.tbtn{
  display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;
  color:var(--ink-soft);transition:background var(--speed),color var(--speed);font-size:12.5px
}
.tbtn:hover{background:var(--panel-2);color:var(--ink)}
.tbtn.on{background:var(--accent-soft);color:var(--accent)}
.tbtn svg{width:15px;height:15px}
#docname{
  flex:1;text-align:center;font-size:12.5px;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px;
}
#docname b{color:var(--ink);font-weight:560}
#docname .dirty{color:var(--accent)}

/* ---------- Paper ---------- */
#scroll{flex:1;overflow:auto;scroll-behavior:smooth}
#scroll::-webkit-scrollbar{width:11px}
#scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:11px;border:3px solid var(--bg)}
#paper{
  max-width:var(--measure); margin:0 auto; padding:64px 40px 45vh;
  font-family:var(--font-text); font-size:17px; line-height:1.72; color:var(--ink);
}
body.wide #paper{max-width:76rem}
body.typewriter #paper{padding-top:38vh}

.block{position:relative; scroll-margin-top:80px}
.block > .rendered > *:first-child{margin-top:0}
.block > .rendered > *:last-child{margin-bottom:0}
.block{margin:0 0 .95em}
body.focus .block{opacity:.28;transition:opacity .2s}
body.focus .block.active,body.focus .block:hover{opacity:1}

/* the raw-source textarea shown on the focused block */
.src{
  display:block;width:100%;border:0;outline:0;resize:none;overflow:hidden;
  background:transparent;color:var(--ink);font-family:var(--font-mono);
  font-size:15px;line-height:1.7;padding:2px 0;margin:0;
  caret-color:var(--accent); white-space:pre-wrap; word-break:break-word;
}
.src::selection{background:var(--sel)}
.block.active{
  box-shadow:-14px 0 0 -12px var(--accent);
  border-radius:2px;
}
.src.t-h1{font-size:26px;font-weight:700}
.src.t-h2{font-size:22px;font-weight:650}
.src.t-h3{font-size:19px;font-weight:600}
.src.t-code{background:var(--code-bg);border-radius:var(--radius);padding:12px 14px;font-size:13.5px;line-height:1.6}
.src.t-quote{color:var(--ink-soft);border-left:3px solid var(--rule);padding-left:12px}
.src.t-front{background:var(--panel);border-radius:var(--radius);padding:10px 12px;font-size:13px;color:var(--ink-soft)}

/* ---------- Rendered markdown ---------- */
.rendered h1,.rendered h2,.rendered h3,.rendered h4,.rendered h5,.rendered h6{
  font-family:var(--font-ui);letter-spacing:-.02em;line-height:1.25;
  margin:1.6em 0 .5em;font-weight:680;
}
.rendered h1{font-size:1.85em;font-weight:750}
.rendered h2{font-size:1.45em;padding-bottom:.25em;border-bottom:1px solid var(--rule-soft)}
.rendered h3{font-size:1.2em}
.rendered h4{font-size:1.05em}
.rendered h5,.rendered h6{font-size:.95em;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.rendered p{margin:0 0 .9em}
.rendered a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.rendered a:hover{text-decoration-color:var(--accent)}
.rendered strong{font-weight:700}
.rendered em{font-style:italic}
.rendered del{color:var(--ink-faint)}
.rendered mark{background:var(--mark);color:var(--ink);padding:0 .15em;border-radius:2px}
.rendered code{
  font-family:var(--font-mono);font-size:.86em;background:var(--code-bg);
  color:var(--code-ink);padding:.14em .38em;border-radius:4px;
}
.rendered pre{
  background:var(--code-bg);border:1px solid var(--rule-soft);border-radius:var(--radius);
  padding:14px 16px;overflow-x:auto;margin:0 0 1em;position:relative
}
.rendered pre code{background:none;padding:0;font-size:13.5px;line-height:1.62;color:var(--code-ink)}
.rendered pre .lang{
  position:absolute;top:6px;right:10px;font-family:var(--font-ui);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);
}
.rendered blockquote{
  margin:0 0 1em;padding:.1em 0 .1em 1.1em;border-left:3px solid var(--accent);
  color:var(--ink-soft);
}
.rendered blockquote > *:last-child{margin-bottom:0}
.rendered ul,.rendered ol{margin:0 0 .9em;padding-left:1.5em}
.rendered li{margin:.18em 0}
.rendered li > ul,.rendered li > ol{margin:.2em 0}
.rendered li.task{list-style:none;margin-left:-1.35em;display:flex;gap:.55em;align-items:flex-start;flex-wrap:wrap}
.rendered li.task > ul,.rendered li.task > ol{flex:0 0 100%;margin-left:1.35em}
.rendered li.task input{margin-top:.42em;accent-color:var(--accent);cursor:pointer}
.rendered li.task.done > span{color:var(--ink-faint);text-decoration:line-through}
.rendered hr{border:0;height:1px;background:var(--rule);margin:2em 0}
.rendered table{border-collapse:collapse;width:100%;margin:0 0 1em;font-size:.92em;display:block;overflow-x:auto}
.rendered th,.rendered td{border:1px solid var(--rule);padding:7px 11px;text-align:left}
.rendered th{background:var(--panel);font-family:var(--font-ui);font-weight:620;font-size:.94em}
.rendered tr:nth-child(even) td{background:color-mix(in srgb,var(--panel) 45%,transparent)}
.rendered img{max-width:100%;border-radius:var(--radius);display:block;margin:.4em 0}
.rendered .frontmatter{
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);
  padding:10px 14px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);
  white-space:pre-wrap;margin:0 0 1em
}
.rendered .fnref a{text-decoration:none;font-size:.75em;padding:0 .15em}
.rendered .footnotes{border-top:1px solid var(--rule);margin-top:2em;padding-top:.8em;font-size:.9em;color:var(--ink-soft)}
.rendered .empty-line{min-height:1.72em}

/* syntax highlight */
.tok-com{color:var(--ink-faint);font-style:italic}
.tok-str{color:#8a6d3b}
.tok-num{color:#a2543a}
.tok-kw{color:#7a4ea8;font-weight:600}
.tok-fn{color:#2b6cb0}
.tok-tag{color:#a03a58}
.tok-attr{color:#8a6d3b}
.tok-punc{color:var(--ink-faint)}
[data-theme="night"] .tok-str,[data-theme="slate"] .tok-str{color:#c3a06a}
[data-theme="night"] .tok-num,[data-theme="slate"] .tok-num{color:#e08a5a}
[data-theme="night"] .tok-kw,[data-theme="slate"] .tok-kw{color:#bb9af7}
[data-theme="night"] .tok-fn,[data-theme="slate"] .tok-fn{color:#7dcfff}
[data-theme="night"] .tok-tag,[data-theme="slate"] .tok-tag{color:#f7768e}
[data-theme="night"] .tok-attr,[data-theme="slate"] .tok-attr{color:#e0af68}

/* ---------- Source & preview modes ---------- */
#source{
  display:none;flex:1;width:100%;border:0;outline:0;resize:none;background:var(--bg);
  color:var(--ink);font-family:var(--font-mono);font-size:14px;line-height:1.7;
  padding:32px max(40px,calc(50% - var(--measure)/2)) 40vh;caret-color:var(--accent)
}
body.mode-source #scroll{display:none}
body.mode-source #source{display:block}

/* ---------- Status bar ---------- */
#status{
  height:26px;flex:0 0 26px;display:flex;align-items:center;gap:14px;
  padding:0 12px;border-top:1px solid var(--rule);background:var(--panel);
  font-size:11.5px;color:var(--ink-faint);
}
#status .grow{flex:1}
#status b{font-weight:560;color:var(--ink-soft)}
#status button{color:var(--ink-faint)}
#status button:hover{color:var(--ink)}

/* ---------- Find bar ---------- */
#find{
  position:absolute;top:50px;right:22px;z-index:30;display:none;
  background:var(--panel);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);padding:8px;gap:6px;flex-direction:column;width:330px
}
#find.on{display:flex}
#find .row{display:flex;gap:6px;align-items:center}
#find input{
  flex:1;background:var(--page);border:1px solid var(--rule);border-radius:6px;
  padding:6px 9px;font-size:12.5px;outline:none
}
#find input:focus{border-color:var(--accent)}
#find .mini{padding:5px 8px;border-radius:6px;font-size:12px;color:var(--ink-soft);background:var(--panel-2)}
#find .mini:hover{color:var(--ink)}
#find .count{font-size:11.5px;color:var(--ink-faint);min-width:56px;text-align:center}

/* ---------- Palette ---------- */
#palette{
  position:fixed;inset:0;z-index:60;display:none;
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(3px)
}
#palette.on{display:block}
#palette .box{
  width:min(560px,92vw);margin:12vh auto 0;background:var(--panel);
  border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden
}
#palette input{width:100%;border:0;outline:0;background:transparent;padding:14px 16px;font-size:15px}
#palette .list{max-height:46vh;overflow:auto;border-top:1px solid var(--rule)}
#palette .opt{
  display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;color:var(--ink-soft);cursor:pointer
}
#palette .opt .k{margin-left:auto;font-size:11px;color:var(--ink-faint);font-family:var(--font-mono)}
#palette .opt.sel{background:var(--accent-soft);color:var(--ink)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--bg);padding:8px 15px;border-radius:20px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80
}
#toast.on{opacity:.94;transform:translateX(-50%) translateY(0)}

/* ---------- Drop overlay ---------- */
#drop{
  position:fixed;inset:0;z-index:70;display:none;place-items:center;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  border:3px dashed var(--accent);font-size:16px;color:var(--accent)
}
#drop.on{display:grid}

@media (max-width:820px){
  #sidebar{position:absolute;z-index:40;height:100%;box-shadow:var(--shadow)}
  body.no-sidebar #sidebar{margin-left:-264px}
  #paper{padding:36px 20px 45vh;font-size:16px}
}

/* ---------- Print / PDF ---------- */
@media print{
  body{overflow:visible;background:#fff}
  #sidebar,#toolbar,#status,#find,#palette,#toast{display:none!important}
  #app,#main{display:block;height:auto}
  #scroll{overflow:visible;height:auto;display:block!important}
  #paper{max-width:none;padding:0;font-size:11.5pt;color:#000}
  .block{opacity:1!important;box-shadow:none!important;break-inside:avoid-page}
  .rendered pre,.rendered table,.rendered blockquote{break-inside:avoid}
  .rendered h1,.rendered h2,.rendered h3{break-after:avoid}
  .rendered a{color:#000}
}
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand"><span class="dot"></span> Inkwell <small>md</small></div>
    </div>
    <div class="side-tabs">
      <button data-pane="files" class="on">Files</button>
      <button data-pane="outline">Outline</button>
      <button data-pane="tags">Tags</button>
    </div>
    <div class="side-body">
      <div class="side-pane on" id="pane-files">
        <div id="tree"></div>
        <button class="side-action" id="btn-openfolder">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          Open folder…
        </button>
        <button class="side-action" id="btn-openfile2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
          Open file…
        </button>
      </div>
      <div class="side-pane" id="pane-outline"><div id="toc"></div></div>
      <div class="side-pane" id="pane-tags"></div>
    </div>
    <div class="side-foot">
      <span style="font-size:11px;color:var(--ink-faint);margin-right:auto">Theme</span>
      <span class="theme-dot on" data-theme="paper" style="background:#fffefb" title="Paper"></span>
      <span class="theme-dot" data-theme="sepia" style="background:#e9dcc6" title="Sepia"></span>
      <span class="theme-dot" data-theme="night" style="background:#24272c" title="Night"></span>
      <span class="theme-dot" data-theme="slate" style="background:#1d2230" title="Slate"></span>
    </div>
  </aside>

  <div id="main">
    <div id="tabs"></div>
    <div id="toolbar">
      <div class="tb">
        <button class="tbtn" id="btn-sidebar" title="Toggle sidebar (⌘\)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <span class="tb-sep"></span>
        <button class="tbtn" id="btn-new" title="New (⌘N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        </button>
        <button class="tbtn" id="btn-open" title="Open (⌘O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </button>
        <button class="tbtn" id="btn-save" title="Save (⌘S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        </button>
      </div>

      <div id="docname"><b>Untitled.md</b></div>

      <div class="tb">
        <button class="tbtn" id="btn-bold" title="Bold (⌘B)"><b style="font-family:var(--font-text)">B</b></button>
        <button class="tbtn" id="btn-italic" title="Italic (⌘I)"><i style="font-family:var(--font-text)">I</i></button>
        <button class="tbtn" id="btn-link" title="Link (⌘K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </button>
        <span class="tb-sep"></span>
        <button class="tbtn" id="btn-find" title="Find &amp; replace (⌘F)">

<script>
/* ===========================================================================
   1. MARKDOWN ENGINE
   Blocks are the unit of editing: a document is a list of source strings.
   =========================================================================== */
"use strict";

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---- block splitting ---------------------------------------------------- */
const RE_ATX   = /^\s{0,3}#{1,6}(\s|$)/;
const RE_HR    = /^\s{0,3}([-*_])[ \t]*(\1[ \t]*){2,}$/;
const RE_FENCE = /^\s{0,3}(`{3,}|~{3,})(.*)$/;
const RE_LI    = /^(\s*)([-*+]|\d{1,9}[.)])(\s+|$)/;
const RE_QUOTE = /^\s{0,3}>/;
const RE_DELIM = /^\s{0,3}(#{1,6}(\s|$)|`{3,}|~{3,}|>)/;
const RE_TSEP  = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;

function splitBlocks(text){
  const lines = String(text).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;

  // YAML front matter, only at the very top of the file
  if (/^---\s*$/.test(lines[0] || "")) {
    let j = 1;
    while (j < lines.length && !/^(---|\.\.\.)\s*$/.test(lines[j])) j++;
    if (j < lines.length) { out.push(lines.slice(0, j + 1).join("\n")); i = j + 1; }
  }

  for (; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) continue;                 // blank lines separate blocks

    let m = line.match(RE_FENCE);
    if (m) {                                    // fenced code
      const ch = m[1][0], n = m[1].length;
      const close = new RegExp("^\\s{0,3}\\" + ch + "{" + n + ",}\\s*$");
      let j = i + 1;
      while (j < lines.length && !close.test(lines[j])) j++;
      const end = Math.min(j, lines.length - 1);
      out.push(lines.slice(i, end + 1).join("\n"));
      i = end; continue;
    }
    if (RE_HR.test(line))  { out.push(line); continue; }
    if (RE_ATX.test(line)) { out.push(line); continue; }

    if (RE_QUOTE.test(line)) {                  // blockquote, with lazy continuation
      let j = i;
      while (j + 1 < lines.length && lines[j+1].trim() && !RE_ATX.test(lines[j+1]) && !RE_FENCE.test(lines[j+1])) j++;
      out.push(lines.slice(i, j + 1).join("\n")); i = j; continue;
    }

    if (line.includes("|") && lines[i+1] !== undefined && lines[i+1].includes("-") && RE_TSEP.test(lines[i+1])) {
      let j = i + 1;                            // table
      while (j + 1 < lines.length && lines[j+1].trim() && lines[j+1].includes("|")) j++;
      out.push(lines.slice(i, j + 1).join("\n")); i = j; continue;
    }

    if (RE_LI.test(line)) {                     // list, blank lines inside allowed
      const ordered = /^\s*\d/.test(line);
      let j = i;
      while (j + 1 < lines.length) {
        const nx = lines[j+1];
        if (!nx.trim()) {
          const nn = lines[j+2];
          // a blank line only stays inside the list for an indented continuation
          // or another item of the same kind; switching bullets to numbers splits
          if (nn && (/^\s{2,}\S/.test(nn) || (RE_LI.test(nn) && /^\s*\d/.test(nn) === ordered))) { j += 1; continue; }
          break;
        }
        if (RE_ATX.test(nx) || RE_FENCE.test(nx) || RE_HR.test(nx)) break;
        j++;
      }
      out.push(lines.slice(i, j + 1).join("\n")); i = j; continue;
    }

    if (/^\s{0,3}<[a-zA-Z!\/]/.test(line)) {    // raw HTML block
      let j = i;
      while (j + 1 < lines.length && lines[j+1].trim()) j++;
      out.push(lines.slice(i, j + 1).join("\n")); i = j; continue;
    }

    if (/^ {4,}\S/.test(line)) {                // indented code
      let j = i;
      while (j + 1 < lines.length && (/^ {4,}/.test(lines[j+1]) || !lines[j+1].trim())) j++;
      while (j > i && !lines[j].trim()) j--;
      out.push(lines.slice(i, j + 1).join("\n")); i = j; continue;
    }

    let j = i;                                  // paragraph
    while (j + 1 < lines.length && lines[j+1].trim() && !RE_DELIM.test(lines[j+1]) && !RE_LI.test(lines[j+1]) && !RE_HR.test(lines[j+1])) j++;
    out.push(lines.slice(i, j + 1).join("\n")); i = j;
  }

  return out.length ? out : [""];
}

/* ---- inline spans ------------------------------------------------------- */
/* Finished fragments are parked behind a sentinel so later passes cannot
   re-process their contents (e.g. underscores inside a URL).                */
const SENT = String.fromCharCode(1);
const RE_SENT = new RegExp(SENT + "(\\d+)" + SENT, "g");

function inline(md){
  const bin = [];
  const K = html => SENT + (bin.push(html) - 1) + SENT;
  let t = String(md);

  t = t.replace(/(`+)([\s\S]*?)\1/g, (_, f, c) => K("<code>" + esc(c.replace(/^ (.*) $/, "$1")) + "</code>"));
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, x) => K(tex2mml(x, true)));
  t = t.replace(/(^|[^\\$])\$([^\s$][^$\n]*?)\$(?!\d)/g, (_, pre, x) => pre + K(tex2mml(x, false)));
  t = t.replace(/\\([\\`*_{}\[\]()#+\-.!>~=|^$])/g, (_, c) => K(esc(c)));
  t = esc(t);
  t = t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,
      (_, page, label) => K('<a class="wiki" href="#" data-page="' + page.trim() + '">' + (label || page).trim() + "</a>"));

  t = t.replace(/!\[([^\]]*)\]\(\s*([^)\s]+)(?:\s+["']([^"']*)["'])?\s*\)/g,
      (_, alt, src, ti) => K('<img src="' + src + '" alt="' + alt + '"' + (ti ? ' title="' + ti + '"' : "") + ">"));
  t = t.replace(/\[\^([^\]\s]+)\]/g,
      (_, id) => K('<sup class="fnref"><a href="#fn-' + id + '">' + esc(id) + "</a></sup>"));
  t = t.replace(/\[([^\]]*)\]\(\s*([^)\s]*)(?:\s+["']([^"']*)["'])?\s*\)/g,
      (_, txt, href, ti) => K('<a href="' + href + '"' + (ti ? ' title="' + ti + '"' : "") + ' target="_blank" rel="noopener">') + txt + K("</a>"));
  t = t.replace(/&lt;((?:https?|mailto):[^\s&]+)&gt;/g,
      (_, u) => K('<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"));
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>"']+[^\s<>"'.,:;)\]])/g,
      (_, pre, u) => pre + K('<a href="' + u + '" target="_blank" rel="noopener">' + u + "</a>"));

  t = t.replace(/\*\*\*([^\s][\s\S]*?)\*\*\*/g, "<strong><em>$1</em></strong>");
  t = t.replace(/\*\*([^\s][\s\S]*?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^\w\\])__([^\s][\s\S]*?)__(?!\w)/g, "$1<strong>$2</strong>");
  t = t.replace(/(^|[^*\w])\*([^\s*][\s\S]*?)\*(?!\*)/g, "$1<em>$2</em>");
  t = t.replace(/(^|[^\w_])_([^\s_][\s\S]*?)_(?!\w)/g, "$1<em>$2</em>");
  t = t.replace(/~~([\s\S]+?)~~/g, "<del>$1</del>");
  t = t.replace(/==([\s\S]+?)==/g, "<mark>$1</mark>");
  t = t.replace(/\^([^\s^]+)\^/g, "<sup>$1</sup>");
  t = t.replace(/(  +|\\)\n/g, "<br>\n");
  t = emojify(t);
  t = t.replace(/(^|[\s(])#([A-Za-z][\w\/-]{0,40})/g,
      (_, pre, tag) => pre + '<a class="tag" href="#" data-tag="' + tag + '">#' + tag + "</a>");

  for (let n = 0; n < 8 && t.indexOf(SENT) >= 0; n++)
    t = t.replace(RE_SENT, (_, i) => bin[+i]);
  return t;
}

/* ---- syntax highlighting ------------------------------------------------ */
const KEYWORDS = {
  js: "await async break case catch class const continue default delete do else export extends finally for from function get if import in instanceof let new of return set static super switch this throw try typeof var void while yield true false null undefined interface type enum implements public private readonly",
  python: "and as assert async await break class continue def del elif else except False finally for from global if import in is lambda None nonlocal not or pass raise return True try while with yield self",
  clike: "auto bool break case catch char class const continue default delete do double else enum extern false float for friend goto if inline int long namespace new nullptr operator private protected public return short signed sizeof static struct switch template this throw true try typedef typename union unsigned using virtual void volatile while func package var type map chan go defer range interface fn let mut impl pub match trait use crate mod where String",
  bash: "if then else elif fi for while do done case esac function return export local source alias echo cd ls set unset read exit sudo",
  sql: "select from where insert into values update set delete create table drop alter add join left right inner outer on group by order having limit offset distinct as and or not null primary key foreign references index union all",
  ruby: "def end class module if elsif else unless while until for do begin rescue ensure return yield self nil true false require attr_accessor puts"
};
const ALIAS = {
  javascript:"js", js:"js", jsx:"js", ts:"js", tsx:"js", typescript:"js", node:"js", json:"json",
  py:"python", python:"python", sh:"bash", shell:"bash", bash:"bash", zsh:"bash", console:"bash",
  html:"html", xml:"html", svg:"html", vue:"html", css:"css", scss:"css", less:"css",
  c:"clike", cpp:"clike", cs:"clike", csharp:"clike", java:"clike", go:"clike", golang:"clike",
  rust:"clike", rs:"clike", php:"clike", swift:"clike", kotlin:"clike", dart:"clike",
  rb:"ruby", ruby:"ruby", sql:"sql", yaml:"yaml", yml:"yaml", toml:"yaml", ini:"yaml", diff:"diff",
  // everything below reuses the closest tokenizer family
  scala:"clike", groovy:"clike", objc:"clike", "objective-c":"clike", m:"clike", zig:"clike", nim:"clike",
  v:"clike", d:"clike", haxe:"clike", solidity:"clike", sol:"clike", glsl:"clike", hlsl:"clike", cuda:"clike",
  arduino:"clike", processing:"clike", verilog:"clike", vhdl:"clike", pascal:"clike", delphi:"clike",
  lua:"clike", julia:"python", jl:"python", r:"python", rlang:"python", perl:"python", pl:"python",
  elixir:"ruby", ex:"ruby", exs:"ruby", erlang:"ruby", crystal:"ruby", haskell:"clike", hs:"clike",
  ocaml:"clike", fsharp:"clike", clojure:"clike", clj:"clike", lisp:"clike", scheme:"clike", racket:"clike",
  powershell:"bash", ps1:"bash", bat:"bash", cmd:"bash", fish:"bash", dockerfile:"bash", docker:"bash",
  makefile:"bash", make:"bash", cmake:"bash", nginx:"bash", apache:"bash", awk:"bash", sed:"bash",
  graphql:"clike", gql:"clike", proto:"clike", protobuf:"clike", thrift:"clike", prisma:"clike",
  hcl:"clike", terraform:"clike", tf:"clike", groovyscript:"clike", gradle:"clike", kt:"clike", kts:"clike",
  svelte:"html", astro:"html", jinja:"html", twig:"html", erb:"html", ejs:"html", handlebars:"html", hbs:"html",
  jsonc:"json", json5:"json", jsonl:"json", ndjson:"json", properties:"yaml", env:"yaml", dotenv:"yaml",
  sass:"css", stylus:"css", postcss:"css", tailwind:"css", plsql:"sql", tsql:"sql", mysql:"sql", psql:"sql"
};

function highlight(code, lang){
  const fam = ALIAS[String(lang || "").toLowerCase()];
  if (!fam) return esc(code);

  if (fam === "html") {
    return esc(code)
      .replace(/&lt;!--[\s\S]*?--&gt;/g, m => '<span class="tok-com">' + m + "</span>")
      .replace(/(&lt;\/?)([\w:-]+)([\s\S]*?)(\/?&gt;)/g, (_, o, name, attrs, c) =>
        '<span class="tok-punc">' + o + '</span><span class="tok-tag">' + name + "</span>" +
        attrs.replace(/([\w:-]+)(=)(&quot;[^&]*&quot;)?/g,
          (_, a, eq, v) => '<span class="tok-attr">' + a + "</span>" + eq + (v ? '<span class="tok-str">' + v + "</span>" : "")) +
        '<span class="tok-punc">' + c + "</span>");
  }
  if (fam === "diff") {
    return esc(code).split("\n").map(l =>
      l.startsWith("+") ? '<span class="tok-fn">' + l + "</span>" :
      l.startsWith("-") ? '<span class="tok-tag">' + l + "</span>" :
      l.startsWith("@") ? '<span class="tok-kw">' + l + "</span>" : l).join("\n");
  }
  if (fam === "yaml") {
    return esc(code).split("\n").map(l =>
      /^\s*#/.test(l) ? '<span class="tok-com">' + l + "</span>"
        : l.replace(/^(\s*-?\s*)([\w.-]+)(\s*:)/, '$1<span class="tok-kw">$2</span><span class="tok-punc">$3</span>')).join("\n");
  }
  if (fam === "css") {
    return esc(code)
      .replace(/\/\*[\s\S]*?\*\//g, m => '<span class="tok-com">' + m + "</span>")
      .replace(/^([^{}\n:]+)(\{)/gm, '<span class="tok-tag">$1</span>$2')
      .replace(/([\w-]+)(\s*:\s*)([^;{}\n]+)/g, '<span class="tok-attr">$1</span>$2<span class="tok-str">$3</span>');
  }
  if (fam === "json") {
    return esc(code)
      .replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="tok-kw">$1</span>$2')
      .replace(/(:\s*)(&quot;[^&]*?&quot;)/g, '$1<span class="tok-str">$2</span>')
      .replace(/\b(true|false|null)\b/g, '<span class="tok-kw">$1</span>')
      .replace(/\b(-?\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
  }

  const kw = new Set((KEYWORDS[fam] || "").split(" "));
  const rx = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b\d[\w.]*\b)|([A-Za-z_$][\w$]*)/g;
  let out = "", last = 0, m;
  while ((m = rx.exec(code))) {
    out += esc(code.slice(last, m.index));
    if (m[1])      out += '<span class="tok-com">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="tok-str">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="tok-num">' + esc(m[3]) + "</span>";
    else {
      const w = m[4];
      out += kw.has(w) ? '<span class="tok-kw">' + w + "</span>"
           : code[rx.lastIndex] === "(" ? '<span class="tok-fn">' + w + "</span>"
           : esc(w);
    }
    last = rx.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ---- block rendering ---------------------------------------------------- */
const slug = s => String(s).toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") || "section";

function renderList(src){
  const items = [];
  let cur = null;
  for (const line of src.split("\n")) {
    const m = line.match(/^(\s*)([-*+]|\d{1,9}[.)])(?:\s+([\s\S]*)|\s*$)/);
    if (m) {
      cur = { indent: m[1].length, ordered: /\d/.test(m[2]), start: parseInt(m[2], 10) || 1,
              lines: [m[3] || ""], kids: [] };
      items.push(cur);
    } else if (cur) {
      cur.lines.push(line.replace(/^ {0,4}/, ""));
    }
  }
  const roots = [], stack = [];
  for (const it of items) {
    while (stack.length && stack[stack.length - 1].indent >= it.indent) stack.pop();
    if (stack.length) stack[stack.length - 1].kids.push(it); else roots.push(it);
    stack.push(it);
  }
  const emit = list => {
    if (!list.length) return "";
    // a run of siblings can switch marker kind; emit one list element per run
    let html = "";
    for (let a = 0; a < list.length; ) {
      let b = a + 1;
      while (b < list.length && list[b].ordered === list[a].ordered) b++;
      html += emitRun(list.slice(a, b));
      a = b;
    }
    return html;
  };
  const emitRun = list => {
    const ord = list[0].ordered;
    const tag = ord ? "ol" : "ul";
    const start = ord && list[0].start !== 1 ? ' start="' + list[0].start + '"' : "";
    let html = "<" + tag + start + ">";
    for (const it of list) {
      const body = it.lines.join("\n").replace(/\s+$/, "");
      const task = body.match(/^\[([ xX])\]\s*([\s\S]*)$/);
      let cls = "", innerHtml;
      if (task) {
        const done = task[1].toLowerCase() === "x";
        cls = ' class="task' + (done ? " done" : "") + '"';
        innerHtml = '<input type="checkbox" ' + (done ? "checked" : "") + "><span>" + inline(task[2]) + "</span>";
      } else {
        innerHtml = (/\n\s*\n/.test(body) || RE_FENCE.test(body.split("\n")[0])) ? renderDoc(body) : inline(body);
      }
      html += "<li" + cls + ">" + innerHtml + emit(it.kids) + "</li>";
    }
    return html + "</" + tag + ">";
  };
  return emit(roots);
}

function renderTable(src){
  const rows = src.split("\n").filter(l => l.trim());
  const cells = r => {
    const s = r.trim().replace(/^\|/, "").replace(/\|$/, "");
    const out = []; let buf = "";
    for (let i = 0; i < s.length; i++) {
      if (s[i] === "\\" && s[i+1] === "|") { buf += "|"; i++; }
      else if (s[i] === "|") { out.push(buf); buf = ""; }
      else buf += s[i];
    }
    out.push(buf);
    return out.map(c => c.trim());
  };
  const head = cells(rows[0]);
  const align = cells(rows[1]).map(c =>
    /^:.*:$/.test(c) ? "center" : /:$/.test(c) ? "right" : /^:/.test(c) ? "left" : "");
  const at = i => align[i] ? ' style="text-align:' + align[i] + '"' : "";
  let html = "<table><thead><tr>";
  head.forEach((h, i) => { html += "<th" + at(i) + ">" + inline(h) + "</th>"; });
  html += "</tr></thead><tbody>";
  for (let r = 2; r < rows.length; r++) {
    const cs = cells(rows[r]);
    html += "<tr>";
    for (let i = 0; i < head.length; i++) html += "<td" + at(i) + ">" + inline(cs[i] || "") + "</td>";
    html += "</tr>";
  }
  return html + "</tbody></table>";
}

function renderBlock(src){
  const s = String(src);
  if (!s.trim()) return '<p class="empty-line"><br></p>';
  const first = s.split("\n")[0];

  if (/^---\s*$/.test(first) && /\n(---|\.\.\.)\s*$/.test(s))
    return '<div class="frontmatter">' + esc(s.replace(/^---\n?/, "").replace(/\n?(---|\.\.\.)\s*$/, "")) + "</div>";

  if (/^\s*\[TOC\]\s*$/i.test(s)) return renderTOC();
  if (/^\$\$[\s\S]*\$\$$/.test(s.trim()))
    return '<div class="math-block">' + tex2mml(s.trim().slice(2, -2), true) + "</div>";

  let m = first.match(RE_FENCE);
  if (m) {
    const lang = (m[2] || "").trim().split(/\s+/)[0];
    const all = s.split("\n").slice(1);
    if (all.length && RE_FENCE.test(all[all.length - 1])) all.pop();
    const code = all.join("\n");
    const lc = lang.toLowerCase();
    if (lc === "mermaid" || lc === "flow" || lc === "flowchart") return renderFlow(code);
    if (lc === "math" || lc === "latex" || lc === "tex")
      return '<div class="math-block">' + tex2mml(code, true) + "</div>";
    const numbered = typeof prefs !== "undefined" && prefs.lineNumbers;
    const gutter = numbered ? '<span class="gutter">' + code.split("\n").map((_, i) => i + 1).join("\n") + "</span>" : "";
    return '<pre' + (numbered ? ' class="numbered"' : "") + ' data-code="' + esc(code) + '">' +
           (lang ? '<span class="lang">' + esc(lang) + "</span>" : "") +
           '<button class="copy" type="button">copy</button>' + gutter +
           "<code>" + highlight(code, lang) + "</code></pre>";
  }
  if (RE_HR.test(first)) return "<hr>";

  m = first.match(/^\s{0,3}(#{1,6})\s*(.*?)\s*#*\s*$/);
  if (m) {
    const lv = m[1].length;
    return "<h" + lv + ' id="' + slug(m[2]) + '">' + inline(m[2]) + "</h" + lv + ">";
  }
  if (RE_QUOTE.test(first)) {
    const inner = s.split("\n").map(l => l.replace(/^\s{0,3}>\s?/, "")).join("\n");
    const callout = inner.match(/^\[!(\w+)\]\s*\n?([\s\S]*)$/);
    if (callout)
      return "<blockquote><p><strong>" + esc(callout[1].toUpperCase()) + "</strong></p>" + renderDoc(callout[2]) + "</blockquote>";
    return "<blockquote>" + renderDoc(inner) + "</blockquote>";
  }
  if (s.includes("|") && s.split("\n")[1] && RE_TSEP.test(s.split("\n")[1])) return renderTable(s);
  if (RE_LI.test(first)) return renderList(s);
  if (/^ {4,}\S/.test(first)) return "<pre><code>" + esc(s.replace(/^ {4}/gm, "")) + "</code></pre>";
  if (/^\s{0,3}<[a-zA-Z!\/]/.test(first)) return s;

  const lines = s.split("\n");
  if (lines.length >= 2 && /^\s{0,3}=+\s*$/.test(lines[lines.length - 1])) {
    const txt = lines.slice(0, -1).join("\n");
    return '<h1 id="' + slug(txt) + '">' + inline(txt) + "</h1>";
  }
  if (lines.length >= 2 && /^\s{0,3}-+\s*$/.test(lines[lines.length - 1])) {
    const txt = lines.slice(0, -1).join("\n");
    return '<h2 id="' + slug(txt) + '">' + inline(txt) + "</h2>";
  }

  const fn = s.match(/^\[\^([^\]\s]+)\]:\s*([\s\S]*)$/);
  if (fn) return '<div class="footnotes" id="fn-' + fn[1] + '"><strong>' + esc(fn[1]) + ".</strong> " + inline(fn[2]) + "</div>";

  return "<p>" + inline(s) + "</p>";
}

const renderDoc = text => splitBlocks(text).map(renderBlock).join("\n");

/* ---- block classification (drives live textarea styling + Enter rules) --- */
function blockType(src){
  const first = (src || "").split("\n")[0];
  if (/^---\s*$/.test(first) && /\n(---|\.\.\.)\s*$/.test(src)) return "front";
  if (RE_FENCE.test(first))    return "code";
  if (RE_QUOTE.test(first))    return "quote";
  if (RE_LI.test(first))       return "list";
  if (src.includes("|") && RE_TSEP.test(src.split("\n")[1] || "")) return "table";
  const h = first.match(/^\s{0,3}(#{1,6})\s/);
  if (h) return "h" + Math.min(3, h[1].length);
  return "p";
}
const MULTILINE = new Set(["front", "code", "quote", "list", "table"]);

/* ---- LaTeX to MathML ----------------------------------------------------
   Browsers render MathML natively, so real math needs no library at all.   */
const TEX_SYM = {
  alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",varepsilon:"ε",zeta:"ζ",eta:"η",
  theta:"θ",vartheta:"ϑ",iota:"ι",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",xi:"ξ",pi:"π",
  rho:"ρ",sigma:"σ",tau:"τ",upsilon:"υ",phi:"φ",varphi:"φ",chi:"χ",psi:"ψ",omega:"ω",
  Gamma:"Γ",Delta:"Δ",Theta:"Θ",Lambda:"Λ",Xi:"Ξ",Pi:"Π",Sigma:"Σ",Upsilon:"Υ",Phi:"Φ",Psi:"Ψ",Omega:"Ω",
  infty:"∞",partial:"∂",nabla:"∇",forall:"∀",exists:"∃",emptyset:"∅",varnothing:"∅",
  hbar:"ℏ",ell:"ℓ",Re:"ℜ",Im:"ℑ",aleph:"ℵ",degree:"°",prime:"′",dots:"…",ldots:"…",cdots:"⋯",vdots:"⋮",ddots:"⋱"
};
const TEX_OP = {
  times:"×",div:"÷",cdot:"⋅",pm:"±",mp:"∓",ast:"∗",star:"⋆",circ:"∘",bullet:"∙",
  leq:"≤",le:"≤",geq:"≥",ge:"≥",neq:"≠",ne:"≠",approx:"≈",equiv:"≡",sim:"∼",simeq:"≃",cong:"≅",
  propto:"∝",ll:"≪",gg:"≫",subset:"⊂",supset:"⊃",subseteq:"⊆",supseteq:"⊇",
  in:"∈",notin:"∉",ni:"∋",cup:"∪",cap:"∩",setminus:"∖",
  to:"→",rightarrow:"→",leftarrow:"←",leftrightarrow:"↔",Rightarrow:"⇒",Leftarrow:"⇐",Leftrightarrow:"⇔",
  mapsto:"↦",implies:"⟹",iff:"⟺",land:"∧",lor:"∨",neg:"¬",oplus:"⊕",otimes:"⊗",
  perp:"⊥",parallel:"∥",angle:"∠",triangle:"△",square:"□",checkmark:"✓"
};
const TEX_BIG = { sum:"∑", prod:"∏", coprod:"∐", int:"∫", iint:"∬", iiint:"∭", oint:"∮",
                  bigcup:"⋃", bigcap:"⋂", bigoplus:"⨁", bigotimes:"⨂", lim:"lim", limsup:"lim sup", liminf:"lim inf", max:"max", min:"min", sup:"sup", inf:"inf" };
const TEX_FN = ["sin","cos","tan","cot","sec","csc","arcsin","arccos","arctan","sinh","cosh","tanh",
                "log","ln","lg","exp","det","dim","ker","deg","gcd","arg","Pr","mod"];
const TEX_DELIM = { "(":"(", ")":")", "[":"[", "]":"]", "\\{":"{", "\\}":"}", "|":"|", "\\|":"‖",
                    "langle":"⟨", "rangle":"⟩", "lceil":"⌈", "rceil":"⌉", "lfloor":"⌊", "rfloor":"⌋", ".":"" };
const MATRIX_FENCE = { pmatrix:["(",")"], bmatrix:["[","]"], Bmatrix:["{","}"], vmatrix:["|","|"], Vmatrix:["‖","‖"], matrix:["",""], cases:["{",""], aligned:["",""], array:["",""] };

function lexTex(s){
  const out = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === "\\") {
      const m = /^\\([a-zA-Z]+|.)/.exec(s.slice(i));
      if (!m) { i++; continue; }
      out.push({ t: "cmd", v: m[1] }); i += m[0].length; continue;
    }
    if ("{}^_&".includes(c)) { out.push({ t: c }); i++; continue; }
    if (/[0-9]/.test(c)) { const m = /^[0-9]*\.?[0-9]+/.exec(s.slice(i)); out.push({ t: "num", v: m[0] }); i += m[0].length; continue; }
    if (/[a-zA-Z]/.test(c)) { out.push({ t: "id", v: c }); i++; continue; }
    out.push({ t: "op", v: c }); i++;
  }
  return out;
}

function texParse(toks){
  let i = 0;
  const mo = (v, extra) => "<mo" + (extra || "") + ">" + esc(v) + "</mo>";
  const peek = () => toks[i];

  function group(){                              // one argument
    const t = peek();
    if (!t) return "<mrow></mrow>";
    if (t.t === "{") { i++; const r = list("}"); if (peek() && peek().t === "}") i++; return "<mrow>" + r + "</mrow>"; }
    return atom();          // a bare argument never takes the outer scripts
  }

  function matrix(kind){
    const rows = [];
    let cells = [], cell = [];
    while (i < toks.length) {
      const t = toks[i];
      if (t.t === "cmd" && t.v === "end") { i++; if (peek() && peek().t === "{") { i++; while (peek() && peek().t !== "}") i++; if (peek()) i++; } break; }
      if (t.t === "&") { i++; cells.push(cell.join("")); cell = []; continue; }
      if (t.t === "cmd" && (t.v === "\\" || t.v === "cr")) { i++; cells.push(cell.join("")); cell = []; rows.push(cells); cells = []; continue; }
      cell.push(atomWithScripts());
    }
    cells.push(cell.join("")); rows.push(cells);
    const body = rows.filter(r => r.join("").trim() !== "").map(r =>
      "<mtr>" + r.map(c => "<mtd>" + (c || "") + "</mtd>").join("") + "</mtr>").join("");
    const f = MATRIX_FENCE[kind] || ["", ""];
    return (f[0] ? mo(f[0], ' stretchy="true"') : "") + "<mtable>" + body + "</mtable>" + (f[1] ? mo(f[1], ' stretchy="true"') : "");
  }

  function atom(){
    const t = toks[i];
    if (!t) return "";
    if (t.t === "num") { i++; return "<mn>" + t.v + "</mn>"; }
    if (t.t === "id")  { i++; return "<mi>" + t.v + "</mi>"; }
    if (t.t === "op")  { i++; return mo(t.v); }
    if (t.t === "{")   { return group(); }
    if (t.t === "}" || t.t === "&") { return ""; }
    if (t.t === "^" || t.t === "_") { return ""; }

    i++;
    const c = t.v;
    if (c === "frac" || c === "dfrac" || c === "tfrac") return "<mfrac>" + group() + group() + "</mfrac>";
    if (c === "binom") return mo("(") + "<mfrac linethickness=\"0\">" + group() + group() + "</mfrac>" + mo(")");
    if (c === "sqrt") {
      if (peek() && peek().t === "op" && peek().v === "[") {
        i++; const idx = [];
        while (peek() && !(peek().t === "op" && peek().v === "]")) idx.push(atomWithScripts());
        if (peek()) i++;
        return "<mroot>" + group() + "<mrow>" + idx.join("") + "</mrow></mroot>";
      }
      return "<msqrt>" + group() + "</msqrt>";
    }
    if (c === "text" || c === "textrm" || c === "mbox") {
      if (peek() && peek().t === "{") {
        i++; let s = "";
        let depth = 1;
        while (peek()) {
          const x = toks[i];
          if (x.t === "{") depth++;
          if (x.t === "}") { depth--; if (!depth) { i++; break; } }
          s += x.v != null ? x.v : (x.t === "cmd" ? "\\" + x.v : x.t);
          if (x.t === "id" || x.t === "num") s = s;
          i++;
          if (toks[i - 1] && (toks[i - 1].t === "id" || toks[i - 1].t === "num" || toks[i - 1].t === "op")) s += "";
        }
        return "<mtext>" + esc(s) + "</mtext>";
      }
      return "";
    }
    if (c === "mathbb" || c === "mathbf" || c === "mathrm" || c === "mathit" || c === "mathcal" || c === "mathsf" || c === "boldsymbol") {
      const variant = { mathbb: "double-struck", mathbf: "bold", mathrm: "normal", mathit: "italic", mathcal: "script", mathsf: "sans-serif", boldsymbol: "bold" }[c];
      const inner = group().replace(/<mi>/g, '<mi mathvariant="' + variant + '">').replace(/<mn>/g, '<mn mathvariant="' + variant + '">');
      return inner;
    }
    if (c === "begin") {
      if (peek() && peek().t === "{") {
        i++; let kind = "";
        while (peek() && peek().t !== "}") { kind += toks[i].v || ""; i++; }
        if (peek()) i++;
        return matrix(kind);
      }
      return "";
    }
    if (c === "left" || c === "right") {
      const d = toks[i];
      let sym = "";
      if (d) {
        sym = d.t === "cmd" ? (TEX_DELIM["\\" + d.v] || TEX_DELIM[d.v] || "") : (TEX_DELIM[d.v] || d.v);
        i++;
      }
      return sym ? mo(sym, ' stretchy="true"') : "";
    }
    if (TEX_BIG[c]) return mo(TEX_BIG[c], ' movablelimits="true"') ;
    if (TEX_SYM[c]) return "<mi>" + esc(TEX_SYM[c]) + "</mi>";
    if (TEX_OP[c])  return mo(TEX_OP[c]);
    if (TEX_FN.includes(c)) return '<mi mathvariant="normal">' + c + "</mi>";
    if (c === "\\" || c === "cr") return "";
    if (c === "quad") return "<mspace width=\"1em\"/>";
    if (c === "qquad") return "<mspace width=\"2em\"/>";
    if (c === ",") return "<mspace width=\"0.17em\"/>";
    if (c === ";") return "<mspace width=\"0.28em\"/>";
    if (c === "{" || c === "}") return mo(c);
    return "<mi>" + esc(c) + "</mi>";
  }

  const SIDE_LIMITS = new Set(["int", "iint", "iiint", "oint"]);
  function atomWithScripts(){
    const startTok = toks[i];
    const isBig = startTok && startTok.t === "cmd" && TEX_BIG[startTok.v] && !SIDE_LIMITS.has(startTok.v);
    let base = atom();
    let sub = null, sup = null;
    while (peek() && (peek().t === "_" || peek().t === "^")) {
      const kind = toks[i].t; i++;
      const arg = group();
      if (kind === "_") sub = arg; else sup = arg;
    }
    if (sub && sup) return (isBig ? "<munderover>" : "<msubsup>") + base + sub + sup + (isBig ? "</munderover>" : "</msubsup>");
    if (sub) return (isBig ? "<munder>" : "<msub>") + base + sub + (isBig ? "</munder>" : "</msub>");
    if (sup) return (isBig ? "<mover>" : "<msup>") + base + sup + (isBig ? "</mover>" : "</msup>");
    return base;
  }

  function list(stop){
    let out = "";
    while (i < toks.length) {
      const t = toks[i];
      if (stop && t.t === stop) break;
      const before = i;
      out += atomWithScripts();
      if (i === before) i++;
    }
    return out;
  }

  return list(null);
}

function tex2mml(tex, display){
  try {
    const body = texParse(lexTex(tex));
    return '<math xmlns="http://www.w3.org/1998/Math/MathML"' + (display ? ' display="block"' : "") +
           ' class="tex"><mrow>' + body + "</mrow></math>";
  } catch (err) {
    return '<code class="tex-error">' + esc(tex) + "</code>";
  }
}

/* ---- flowchart diagrams (a compact mermaid subset) ---------------------- */
function renderFlow(src){
  const lines = src.split("\n").map(l => l.trim()).filter(Boolean);
  let dir = "TD";
  const head = lines[0] && lines[0].match(/^(?:graph|flowchart)\s+(TD|TB|LR|RL|BT)\s*$/i);
  if (head) { dir = head[1].toUpperCase(); lines.shift(); }
  else if (/^(graph|flowchart)\b/i.test(lines[0] || "")) lines.shift();

  const nodes = new Map(), edges = [];
  const shapeOf = (open) => open === "{" ? "diamond" : open === "((" ? "circle" : open === "(" ? "round" : "rect";
  const nodeRe = /([A-Za-z0-9_]+)(?:(\(\(|\[|\(|\{)([^\]\)\}]*)(?:\)\)|\]|\)|\}))?/g;

  const touchNode = (id, open, label) => {
    if (!nodes.has(id)) nodes.set(id, { id, label: id, shape: "rect", order: nodes.size });
    const n = nodes.get(id);
    if (label != null && label !== "") { n.label = label.replace(/^["']|["']$/g, ""); n.shape = shapeOf(open); }
    return n;
  };

  for (const line of lines) {
    const m = line.match(/^(.*?)\s*(-{2,3}>|-{3}|-\.->|={2,}>)\s*(?:\|([^|]*)\|)?\s*(.*)$/);
    if (m && m[4]) {
      const parse = side => { nodeRe.lastIndex = 0; const r = nodeRe.exec(side.trim()); return r ? touchNode(r[1], r[2], r[3]) : null; };
      const a = parse(m[1]), b = parse(m[4]);
      if (a && b) edges.push({ from: a.id, to: b.id, label: m[3] || "", dashed: m[2].includes("."), thick: m[2].includes("=") , arrow: m[2].includes(">") });
      continue;
    }
    nodeRe.lastIndex = 0;
    const r = nodeRe.exec(line);
    if (r && r[1]) touchNode(r[1], r[2], r[3]);
  }
  if (!nodes.size) return '<pre><code>' + esc(src) + "</code></pre>";

  // rank nodes by longest path, ignoring back edges so cycles stay readable
  const list = Array.from(nodes.values());
  const incoming = new Map(list.map(n => [n.id, 0]));
  edges.forEach(e => incoming.set(e.to, (incoming.get(e.to) || 0) + 1));

  const adj = new Map(list.map(n => [n.id, []]));
  edges.forEach(e => { if (adj.has(e.from)) adj.get(e.from).push(e.to); });
  const mark = new Map(), back = new Set();
  (function order(){
    const stack = [];
    const visit = id => {
      mark.set(id, 1);
      for (const to of adj.get(id) || []) {
        const st = mark.get(to) || 0;
        if (st === 1) back.add(id + ">" + to);      // edge to an ancestor: a loop
        else if (st === 0) visit(to);
      }
      mark.set(id, 2);
      stack.push(id);
    };
    list.filter(n => !incoming.get(n.id)).forEach(n => { if (!mark.get(n.id)) visit(n.id); });
    list.forEach(n => { if (!mark.get(n.id)) visit(n.id); });
  })();

  const forward = edges.filter(e => !back.has(e.from + ">" + e.to));
  list.forEach(n => n.rank = 0);
  let changed = true, guard = 0;
  while (changed && guard++ < 80) {
    changed = false;
    for (const e of forward) {
      const a = nodes.get(e.from), b = nodes.get(e.to);
      if (b.rank < a.rank + 1) { b.rank = a.rank + 1; changed = true; }
    }
  }

  const horizontal = dir === "LR" || dir === "RL";
  const rows = new Map();
  list.forEach(n => { if (!rows.has(n.rank)) rows.set(n.rank, []); rows.get(n.rank).push(n); });

  const PAD = 16, GAPX = 34, GAPY = 62, H = 42;
  const widthOf = n => Math.max(64, n.label.length * 7.6 + (n.shape === "diamond" ? 42 : 26));
  let cross = 0, along = 0;
  const ranks = Array.from(rows.keys()).sort((a, b) => a - b);

  for (const r of ranks) {
    const row = rows.get(r);
    let span = row.reduce((s, n) => s + widthOf(n), 0) + GAPX * (row.length - 1);
    if (horizontal) {
      const rowH = row.length * H + GAPY * 0.5 * (row.length - 1);
      cross = Math.max(cross, rowH);
    } else cross = Math.max(cross, span);
  }
  for (const r of ranks) {
    const row = rows.get(r);
    if (horizontal) {
      const rowH = row.length * H + (GAPY * 0.5) * (row.length - 1);
      let y = (cross - rowH) / 2;
      row.forEach(n => { n.w = widthOf(n); n.h = H; n.y = y + PAD; n.x = PAD + along; y += H + GAPY * 0.5; });
      along += Math.max.apply(null, row.map(widthOf)) + GAPY + 20;
    } else {
      const span = row.reduce((s, n) => s + widthOf(n), 0) + GAPX * (row.length - 1);
      let x = (cross - span) / 2;
      row.forEach(n => { n.w = widthOf(n); n.h = H; n.x = x + PAD; n.y = PAD + along; x += n.w + GAPX; });
      along += H + GAPY;
    }
  }
  const W = (horizontal ? along : cross) + PAD * 2;
  const HT = (horizontal ? cross : along) + PAD * 2;

  const shape = n => {
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    if (n.shape === "diamond")
      return '<polygon points="' + [ [cx, n.y - 6], [n.x + n.w + 8, cy], [cx, n.y + n.h + 6], [n.x - 8, cy] ].map(p => p.join(",")).join(" ") + '" class="fl-shape"/>';
    if (n.shape === "circle")
      return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (n.w / 2 + 4) + '" ry="' + (n.h / 2 + 2) + '" class="fl-shape"/>';
    const r = n.shape === "round" ? n.h / 2 : 7;
    return '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="' + r + '" class="fl-shape"/>';
  };

  let svg = '<svg class="flow" viewBox="0 0 ' + Math.ceil(W) + " " + Math.ceil(HT) + '" width="' + Math.ceil(W) + '" role="img">' +
    '<defs><marker id="fl-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M0,0 L10,5 L0,10 z" class="fl-arrow"/></marker></defs>';

  for (const e of edges) {
    const a = nodes.get(e.from), b = nodes.get(e.to);
    if (!a || !b) continue;
    let x1, y1, x2, y2;
    if (horizontal) { x1 = a.x + a.w; y1 = a.y + a.h / 2; x2 = b.x; y2 = b.y + b.h / 2; }
    else { x1 = a.x + a.w / 2; y1 = a.y + a.h; x2 = b.x + b.w / 2; y2 = b.y; }
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const d = horizontal
      ? "M" + x1 + "," + y1 + " C" + (mx) + "," + y1 + " " + (mx) + "," + y2 + " " + x2 + "," + y2
      : "M" + x1 + "," + y1 + " C" + x1 + "," + my + " " + x2 + "," + my + " " + x2 + "," + y2;
    svg += '<path d="' + d + '" class="fl-edge' + (e.dashed ? " dashed" : "") + (e.thick ? " thick" : "") + '"' +
           (e.arrow ? ' marker-end="url(#fl-ar)"' : "") + "/>";
    if (e.label) {
      const tw = e.label.length * 6.2 + 10;
      svg += '<rect x="' + (mx - tw / 2) + '" y="' + (my - 9) + '" width="' + tw + '" height="17" rx="4" class="fl-lbl-bg"/>' +
             '<text x="' + mx + '" y="' + (my + 3.5) + '" class="fl-lbl">' + esc(e.label) + "</text>";
    }
  }
  for (const n of list) {
    svg += shape(n) + '<text x="' + (n.x + n.w / 2) + '" y="' + (n.y + n.h / 2 + 4.5) + '" class="fl-text">' + esc(n.label) + "</text>";
  }
  return '<div class="flow-wrap">' + svg + "</svg></div>";
}

  thinking:"🤔",neutral_face:"😐",confused:"😕",cry:"😢",sob:"😭",angry:"😠",scream:"😱",

/* ---- [TOC] -------------------------------------------------------------- */
function renderTOC(){
  const items = [];
  for (const b of state.blocks) {
    const m = b.src.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if (m) items.push({ lvl: m[1].length, text: m[2].replace(/[*_`~]/g, "").trim() });
  }
  if (!items.length) return '<div class="toc-box"><em>No headings yet.</em></div>';
  const min = Math.min.apply(null, items.map(i => i.lvl));
  return '<div class="toc-box"><div class="toc-h">Contents</div><ul>' +
    items.map(i => '<li style="margin-left:' + ((i.lvl - min) * 15) + 'px"><a href="#' + slug(i.text) + '">' + inline(i.text) + "</a></li>").join("") +
    "</ul></div>";

<script>
/* ===========================================================================
   2. EDITOR
   One block is "active" at a time and shows its raw markdown in a textarea;
   every other block shows rendered HTML. That is the Typora feel.
   =========================================================================== */
const LS = {
  ok: true,
  get(k){ try { return localStorage.getItem(k); } catch (e) { LS.ok = false; return null; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch (e) { LS.ok = false; return false; } }
};
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const paper  = $("#paper");
const scroll = $("#scroll");

let uid = 0;
const mkBlock = src => ({ id: ++uid, src: src == null ? "" : src });

const state = {
  blocks: [mkBlock("")],
  activeId: null,
  name: "Untitled.md",
  dirty: false,
  handle: null,     // FileSystemFileHandle when opened from disk
  dirHandle: null,
  committing: false
};

const prefs = {
  theme: "paper", sidebar: true, focus: false, typewriter: false, wide: false, source: false
};

const serialize = () => state.blocks.map(b => b.src).join("\n\n").replace(/\n{3,}/g, "\n\n");
const blockIndex = id => state.blocks.findIndex(b => b.id === id);
const blockEls = id => paper.querySelector('.block[data-id="' + id + '"]');

/* ---- painting ----------------------------------------------------------- */
function blockEl(b){
  const el = document.createElement("div");
  el.className = "block";
  el.dataset.id = b.id;
  if (b.id === state.activeId) {
    el.classList.add("active");
    el.appendChild(makeTextarea(b));
  } else {
    const r = document.createElement("div");
    r.className = "rendered";
    r.innerHTML = renderBlock(b.src);
    el.appendChild(r);
  }
  return el;
}

function renderAll(){
  paper.textContent = "";
  const frag = document.createDocumentFragment();
  for (const b of state.blocks) frag.appendChild(blockEl(b));
  paper.appendChild(frag);
  touch(false);
}

function repaint(id){
  const el = blockEls(id);
  const b = state.blocks[blockIndex(id)];
  if (el && b) el.replaceWith(blockEl(b));
}

function makeTextarea(b){
  const ta = document.createElement("textarea");
  ta.className = "src t-" + blockType(b.src);
  ta.spellcheck = true;
  ta.rows = 1;
  ta.value = b.src;
  ta.addEventListener("input", onInput);
  ta.addEventListener("keydown", autoPairKey);
  ta.addEventListener("keydown", onKey);
  ta.addEventListener("blur", () => { if (!state.committing) commit(); });
  ta.addEventListener("paste", onPaste);
  requestAnimationFrame(() => autosize(ta));
  return ta;
}

const autosize = ta => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };

function onInput(e){
  const ta = e.target;
  autosize(ta);
  const idx = blockIndex(state.activeId);
  if (idx >= 0) state.blocks[idx].src = ta.value;
  ta.className = "src t-" + blockType(ta.value);
  slashWatch(ta);
  positionTableTools();
  touch(true);
}

/* ---- activation / commit ------------------------------------------------ */
function activate(id, caret, caretEnd){
  if (state.activeId === id) {
    const ta = blockEls(id) && blockEls(id).querySelector(".src");
    if (ta && caret != null) { ta.focus(); ta.setSelectionRange(caret, caretEnd == null ? caret : caretEnd); }
    return;
  }
  commit();
  if (blockIndex(id) < 0) return;
  state.activeId = id;
  repaint(id);
  const el = blockEls(id);
  const ta = el && el.querySelector(".src");
  if (!ta) return;
  autosize(ta);
  ta.focus();
  const n = caret == null ? ta.value.length : Math.max(0, Math.min(caret, ta.value.length));
  ta.setSelectionRange(n, caretEnd == null ? n : Math.min(caretEnd, ta.value.length));
  if (prefs.typewriter) el.scrollIntoView({ block: "center", behavior: "smooth" });
  else keepInView(el);
  positionTableTools();
}

function keepInView(el){
  const r = el.getBoundingClientRect(), s = scroll.getBoundingClientRect();
  if (r.top < s.top + 60) scroll.scrollTop -= (s.top + 60 - r.top);
  else if (r.bottom > s.bottom - 60) scroll.scrollTop += (r.bottom - s.bottom + 60);
}

function commit(){
  if (typeof closeSlash === "function") { closeSlash(); $("#tabletools").classList.remove("on"); }
  const id = state.activeId;
  if (id == null) return;
  const idx = blockIndex(id);
  state.activeId = null;
  if (idx < 0) return;

  const el = blockEls(id);
  const ta = el && el.querySelector(".src");
  if (ta) state.blocks[idx].src = ta.value;

  const val = state.blocks[idx].src;
  const fresh = (!val.trim() && state.blocks.length > 1) ? [] : splitBlocks(val).map(mkBlock);

  state.committing = true;
  state.blocks.splice(idx, 1, ...fresh);
  if (el) {
    if (!fresh.length) el.remove();
    else {
      const frag = document.createDocumentFragment();
      fresh.forEach(b => frag.appendChild(blockEl(b)));
      el.replaceWith(frag);
    }
  }
  state.committing = false;
  if (!state.blocks.length) { state.blocks = [mkBlock("")]; renderAll(); }
  touch(false);
}

/* ---- keyboard inside a block ------------------------------------------- */
function insertAt(ta, text){
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.setSelectionRange(s + text.length, s + text.length);
  ta.dispatchEvent(new Event("input"));
}

function splitBlockAtCaret(ta){
  const pos = ta.selectionStart;
  const after = ta.value.slice(pos);
  ta.value = ta.value.slice(0, pos);
  const idx = blockIndex(state.activeId);
  const nb = mkBlock(after);
  state.blocks.splice(idx + 1, 0, nb);
  const el = blockEls(state.activeId);
  if (el) el.after(blockEl(nb));
  commit();
  activate(nb.id, 0);
}

function mergeInto(prevIdx, curIdx){
  const prev = state.blocks[prevIdx], cur = state.blocks[curIdx];
  const caret = prev.src.length;
  prev.src = prev.src + (cur.src ? "\n" + cur.src : "");
  const curEl = blockEls(cur.id);
  state.activeId = null;
  state.blocks.splice(curIdx, 1);
  if (curEl) curEl.remove();
  repaint(prev.id);
  activate(prev.id, caret);
}

function onKey(e){
  const ta = e.target;
  const pos = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  const idx = blockIndex(state.activeId);
  const type = blockType(val);
  const mod = e.metaKey || e.ctrlKey;

  if (mod && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "b") { e.preventDefault(); wrapSel(ta, "**", "**"); return; }
    if (k === "i") { e.preventDefault(); wrapSel(ta, "*", "*"); return; }
    if (k === "k") { e.preventDefault(); linkSel(ta); return; }
    if (k === "e") { e.preventDefault(); wrapSel(ta, "`", "`"); return; }
    if (k === "u") { e.preventDefault(); wrapSel(ta, "~~", "~~"); return; }
    if (e.shiftKey && k === "h") { e.preventDefault(); wrapSel(ta, "==", "=="); return; }
    if (k >= "1" && k <= "6") { e.preventDefault(); setHeading(ta, +k); return; }
    if (k === "0") { e.preventDefault(); setHeading(ta, 0); return; }
  }

  if (e.key === "Escape") { e.preventDefault(); commit(); paper.focus(); return; }

  if (e.key === "Tab") {
    e.preventDefault();
    if (e.shiftKey) {
      const ls = val.lastIndexOf("\n", pos - 1) + 1;
      if (val.slice(ls, ls + 2) === "  ") {
        ta.value = val.slice(0, ls) + val.slice(ls + 2);
        ta.setSelectionRange(Math.max(ls, pos - 2), Math.max(ls, pos - 2));
        ta.dispatchEvent(new Event("input"));
      }
    } else insertAt(ta, "  ");
    return;
  }

  if (e.key === "Enter") {
    if (e.shiftKey) {
      e.preventDefault();
      insertAt(ta, MULTILINE.has(type) ? "\n" : "  \n");
      return;
    }
    if (type === "code" || type === "front" || type === "table") return;   // plain newline

    if (type === "quote") {
      const line = val.slice(val.lastIndexOf("\n", pos - 1) + 1, pos);
      e.preventDefault();
      if (/^\s{0,3}>\s*$/.test(line)) {                   // empty quote line: leave the quote
        ta.value = val.slice(0, pos - line.length) + val.slice(pos);
        ta.setSelectionRange(pos - line.length, pos - line.length);
        ta.dispatchEvent(new Event("input"));
        splitBlockAtCaret(ta);
      } else insertAt(ta, "\n> ");
      return;
    }

    if (type === "list") {
      const ls = val.lastIndexOf("\n", pos - 1) + 1;
      const line = val.slice(ls, pos);
      const m = line.match(/^(\s*)([-*+]|\d{1,9}[.)])\s+(\[[ xX]\]\s+)?(.*)$/);
      e.preventDefault();
      if (m && !m[4].trim()) {                            // empty item: end the list
        ta.value = val.slice(0, ls) + val.slice(pos);
        ta.setSelectionRange(ls, ls);
        ta.dispatchEvent(new Event("input"));
        splitBlockAtCaret(ta);
      } else if (m) {
        let marker = m[2];
        if (/\d/.test(marker)) marker = (parseInt(marker, 10) + 1) + marker.slice(-1);
        insertAt(ta, "\n" + m[1] + marker + " " + (m[3] ? "[ ] " : ""));
      } else insertAt(ta, "\n");
      return;
    }

    e.preventDefault();
    splitBlockAtCaret(ta);
    return;
  }

  if (e.key === "Backspace" && pos === 0 && end === 0) {
    if (idx > 0) { e.preventDefault(); state.blocks[idx].src = val; mergeInto(idx - 1, idx); }
    return;
  }
  if (e.key === "Delete" && pos === val.length && end === val.length) {
    if (idx >= 0 && idx < state.blocks.length - 1) {
      e.preventDefault();
      state.blocks[idx].src = val;
      const next = state.blocks[idx + 1];
      const nextEl = blockEls(next.id);
      state.blocks[idx].src += next.src ? "\n" + next.src : "";
      state.blocks.splice(idx + 1, 1);
      if (nextEl) nextEl.remove();
      const b = state.blocks[idx];
      state.activeId = null;
      repaint(b.id);
      activate(b.id, val.length);
    }
    return;
  }

  if (e.key === "ArrowUp" && !e.shiftKey) {
    if (val.lastIndexOf("\n", pos - 1) === -1 && idx > 0) {
      e.preventDefault();
      const col = pos;
      const prev = state.blocks[idx - 1];
      const lastLine = prev.src.length - (prev.src.lastIndexOf("\n") + 1);
      activate(prev.id, prev.src.length - lastLine + Math.min(col, lastLine));
    }
    return;
  }
  if (e.key === "ArrowDown" && !e.shiftKey) {
    if (val.indexOf("\n", pos) === -1 && idx >= 0 && idx < state.blocks.length - 1) {
      e.preventDefault();
      const col = pos - (val.lastIndexOf("\n", pos - 1) + 1);
      const next = state.blocks[idx + 1];
      const firstLine = next.src.indexOf("\n") === -1 ? next.src.length : next.src.indexOf("\n");
      activate(next.id, Math.min(col, firstLine));
    }
    return;
  }
  if (e.key === "ArrowLeft" && pos === 0 && end === 0 && idx > 0) {
    e.preventDefault(); activate(state.blocks[idx - 1].id); return;
  }
  if (e.key === "ArrowRight" && pos === val.length && end === val.length && idx < state.blocks.length - 1) {
    e.preventDefault(); activate(state.blocks[idx + 1].id, 0); return;
  }
}

function wrapSel(ta, a, b){
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  if (sel) {
    const already = ta.value.slice(s - a.length, s) === a && ta.value.slice(e, e + b.length) === b;
    if (already) {
      ta.value = ta.value.slice(0, s - a.length) + sel + ta.value.slice(e + b.length);
      ta.setSelectionRange(s - a.length, e - a.length);
    } else {
      ta.value = ta.value.slice(0, s) + a + sel + b + ta.value.slice(e);
      ta.setSelectionRange(s + a.length, e + a.length);
    }
  } else {
    ta.value = ta.value.slice(0, s) + a + b + ta.value.slice(s);
    ta.setSelectionRange(s + a.length, s + a.length);
  }
  ta.dispatchEvent(new Event("input"));
}

function linkSel(ta){
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e) || "text";
  const isUrl = /^(https?:\/\/|mailto:|\/|#)/.test(sel);
  const md = isUrl ? "[](" + sel + ")" : "[" + sel + "](url)";
  ta.value = ta.value.slice(0, s) + md + ta.value.slice(e);
  const caret = isUrl ? s + 1 : s + sel.length + 3;
  ta.setSelectionRange(caret, isUrl ? caret : caret + 3);
  ta.dispatchEvent(new Event("input"));
}

function setHeading(ta, level){
  const ls = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  const le = ta.value.indexOf("\n", ls) === -1 ? ta.value.length : ta.value.indexOf("\n", ls);
  const line = ta.value.slice(ls, le).replace(/^\s{0,3}#{1,6}\s*/, "");
  const next = (level ? "#".repeat(level) + " " : "") + line;
  ta.value = ta.value.slice(0, ls) + next + ta.value.slice(le);
  ta.setSelectionRange(ls + next.length, ls + next.length);
  ta.dispatchEvent(new Event("input"));
}

function onPaste(e){
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith("image/")) {
      const file = it.getAsFile();
      if (!file) continue;
      e.preventDefault();
      const fr = new FileReader();
      fr.onload = () => insertAt(e.target, "![pasted image](" + fr.result + ")");
      fr.readAsDataURL(file);
      return;
    }
  }
}

/* ---- clicking into a block --------------------------------------------- */
function srcOffsetFor(src, plain, n){
  let si = 0, pi = 0;
  while (si < src.length && pi < n) {
    if (src[si] === plain[pi]) { si++; pi++; }
    else si++;
  }
  return si;
}

function caretFromClick(el, block, ev){
  let range = null;
  if (document.caretRangeFromPoint) range = document.caretRangeFromPoint(ev.clientX, ev.clientY);
  else if (document.caretPositionFromPoint) {
    const p = document.caretPositionFromPoint(ev.clientX, ev.clientY);
    if (p) { range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
  }
  const rendered = el.querySelector(".rendered");
  if (!range || !rendered || !rendered.contains(range.startContainer)) return null;
  const pre = document.createRange();
  pre.selectNodeContents(rendered);
  pre.setEnd(range.startContainer, range.startOffset);
  const n = pre.toString().length;
  return srcOffsetFor(block.src, rendered.textContent, n);
}

paper.addEventListener("mousedown", e => {
  if (e.target.closest("a")) return;
  const el = e.target.closest(".block");
  if (!el) return;
  if (e.target.matches('input[type="checkbox"]')) { toggleTask(el, e.target); e.preventDefault(); return; }
  const b = state.blocks[blockIndex(+el.dataset.id)];
  if (!b || b.id === state.activeId) return;
  e.preventDefault();
  activate(b.id, caretFromClick(el, b, e));
});

paper.addEventListener("click", e => {
  if (e.target !== paper) return;
  const last = state.blocks[state.blocks.length - 1];
  if (last && !last.src.trim()) return activate(last.id);
  const nb = mkBlock("");
  state.blocks.push(nb);
  paper.appendChild(blockEl(nb));
  activate(nb.id, 0);
});

scroll.addEventListener("click", e => {
  if (e.target !== scroll) return;
  const last = state.blocks[state.blocks.length - 1];
  if (last) activate(last.id);
});

function toggleTask(el, box){
  const idx = blockIndex(+el.dataset.id);
  if (idx < 0) return;
  const boxes = Array.from(el.querySelectorAll('input[type="checkbox"]'));
  const n = boxes.indexOf(box);
  let seen = -1;
  state.blocks[idx].src = state.blocks[idx].src.replace(/\[([ xX])\]/g, (m, c) => {
    seen++;
    return seen === n ? (c.toLowerCase() === "x" ? "[ ]" : "[x]") : m;
  });
  repaint(state.blocks[idx].id);
  touch(true);
}

/* ---- document lifecycle ------------------------------------------------- */
function loadText(text, name){
  state.blocks = splitBlocks(text).map(mkBlock);
  state.activeId = null;
  if (name) state.name = name;
  state.dirty = false;
  renderAll();
  scroll.scrollTop = 0;
  $("#source").value = serialize();
}

let saveTimer = null;
function touch(dirty){
  if (dirty) state.dirty = true;
  const text = serialize();
  const words = (text.replace(/[#>*_`~\-\[\]()!|]/g, " ").match(/\S+/g) || []).length;
  $("#st-words").textContent = words.toLocaleString();
  $("#st-chars").textContent = text.length.toLocaleString();
  $("#st-lines").textContent = text.split("\n").length.toLocaleString();
  $("#st-read").textContent = Math.max(1, Math.round(words / 220));
  if (typeof drawGoal === "function") drawGoal();
  $("#docname").innerHTML = "<b>" + esc(state.name) + "</b>" + (state.dirty ? ' <span class="dirty">•</span>' : "");
  buildOutline();
  if (typeof buildTags === "function") buildTags();
  if (typeof docs !== "undefined" && curDoc != null) {
    const d = docs.find(x => x.id === curDoc);
    if (d && d.dirty !== state.dirty) { d.dirty = state.dirty; renderTabs(); }
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 600);
}

function persist(){
  const ok = LS.set("inkwell:doc", serialize()) && LS.set("inkwell:name", state.name) && LS.set("inkwell:prefs", JSON.stringify(prefs));
  $("#st-saved").textContent = ok
    ? "draft saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : "local drafts unavailable";
}

function buildOutline(){
  const toc = $("#toc");
  const heads = [];
  state.blocks.forEach(b => {
    const m = b.src.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if (m) heads.push({ id: b.id, lvl: m[1].length, text: m[2].replace(/[*_`~]/g, "") });
  });
  if (!heads.length) { toc.innerHTML = '<div class="side-empty">No headings yet.<br>Start a line with <code>#</code>.</div>'; return; }
  toc.textContent = "";
  heads.forEach(h => {
    const b = document.createElement("button");
    b.className = "toc-item";
    b.dataset.lvl = h.lvl;
    b.textContent = h.text;
    b.title = h.text;
    b.onclick = () => {
      const el = blockEls(h.id);
      if (el) { el.scrollIntoView({ block: "start", behavior: "smooth" }); activate(h.id); }
    };
    toc.appendChild(b);
  });
}
</script>

<script>
/* ===========================================================================
   3. FILES, CHROME, COMMANDS
   =========================================================================== */
const MD_TYPES = [{ description: "Markdown", accept: { "text/markdown": [".md", ".markdown", ".mdown", ".mkd", ".txt"] } }];
const hasFSA = typeof window.showOpenFilePicker === "function";

const hiddenInput = document.createElement("input");
hiddenInput.type = "file";
hiddenInput.accept = ".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain";
hiddenInput.style.display = "none";
document.body.appendChild(hiddenInput);
hiddenInput.addEventListener("change", async () => {
  const f = hiddenInput.files[0];
  if (!f) return;
  adoptDocument(await f.text(), f.name, null);
  toast("Opened " + f.name);
  hiddenInput.value = "";
});

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("on"), 1800);
}

function download(name, text, mime){
  const blob = new Blob([text], { type: (mime || "text/markdown") + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function cmdNew(){
  if (!(await guardUnsaved())) return;
  state.handle = null;
  loadText("# Untitled\n\n", "Untitled.md");
  activate(state.blocks[0].id);
}

async function cmdOpen(){
  commit();
  if (!hasFSA) return hiddenInput.click();
  try {
    const [h] = await showOpenFilePicker({ types: MD_TYPES });
    const f = await h.getFile();
    adoptDocument(await f.text(), f.name, h);
    toast("Opened " + f.name);
  } catch (err) { if (err && err.name !== "AbortError") hiddenInput.click(); }
}

async function cmdSave(as){
  commit();
  const text = serialize();
  try {
    if (!as && state.handle && state.handle.createWritable) {
      const w = await state.handle.createWritable();
      await w.write(text); await w.close();
      state.dirty = false; touch(false); snapshotHistory("save"); toast("Saved " + state.name);
      return;
    }
    if (window.showSaveFilePicker) {
      const h = await showSaveFilePicker({ suggestedName: state.name, types: MD_TYPES });
      const w = await h.createWritable();
      await w.write(text); await w.close();
      state.handle = h; state.name = h.name;
      state.dirty = false; touch(false); snapshotHistory("save"); toast("Saved " + state.name);
      return;
    }
  } catch (err) { if (err && err.name === "AbortError") return; }
  download(state.name, text);
  state.dirty = false; touch(false);
  toast("Downloaded " + state.name);
}

/* ---- folder browsing ---------------------------------------------------- */
async function cmdOpenFolder(){
  if (!window.showDirectoryPicker) {
    say("Browsing a folder needs the File System Access API, which today means Chrome, Edge or Opera on the desktop. You can still open single files, and saving will download a copy.", "Folder browsing unavailable");
    return;
  }
  try {
    state.dirHandle = await showDirectoryPicker();
    await buildTree();
    setPane("files");
  } catch (err) { if (err && err.name !== "AbortError") toast("Could not open folder"); }
}

let fileIndex = [];
async function buildTree(){
  const tree = $("#tree");
  tree.textContent = "";
  const files = [];
  async function walk(dir, prefix, depth){
    if (depth > 3) return;
    for await (const entry of dir.values()) {
      if (entry.name.startsWith(".")) continue;
      if (entry.kind === "file" && /\.(md|markdown|mdown|mkd|txt)$/i.test(entry.name))
        files.push({ handle: entry, label: prefix + entry.name });
      else if (entry.kind === "directory" && files.length < 400)
        await walk(entry, prefix + entry.name + "/", depth + 1);
    }
  }
  await walk(state.dirHandle, "", 0);
  files.sort((a, b) => a.label.localeCompare(b.label));
  fileIndex = files;
  if (!files.length) { tree.innerHTML = '<div class="side-empty">No markdown files in that folder.</div>'; return; }
  for (const f of files) {
    const b = document.createElement("button");
    b.className = "tree-item";
    b.title = f.label;
    b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
    b.appendChild(document.createTextNode(f.label));
    b.onclick = async () => {
      if (!(await guardUnsaved())) return;
      const file = await f.handle.getFile();
      adoptDocument(await file.text(), file.name, f.handle);
      $$(".tree-item").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
    };
    tree.appendChild(b);
  }
}
