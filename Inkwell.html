/* ---- find & replace ----------------------------------------------------- */
let matches = [], mIdx = -1;
function findRegex(){
  const q = $("#find-q").value;
  $("#find-q").classList.remove("bad");
  if (!q) return null;
  let body = $("#find-re").checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if ($("#find-word").checked) body = "\\b(?:" + body + ")\\b";
  try { return new RegExp(body, $("#find-case").checked ? "g" : "gi"); }
  catch (err) { $("#find-q").classList.add("bad"); return null; }
}
function runFind(){
  matches = []; mIdx = -1;
  const re = findRegex();
  if (re) state.blocks.forEach((b, i) => {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(b.src))) {
      matches.push({ i, at: m.index, len: m[0].length });
      if (!m[0].length) re.lastIndex++;
      if (matches.length > 5000) break;
    }
  });
  $("#find-count").textContent = (matches.length ? 1 : 0) + "/" + matches.length;
  if (matches.length) gotoMatch(0);
}
function gotoMatch(k){
  if (!matches.length) return;
  mIdx = (k + matches.length) % matches.length;
  const m = matches[mIdx];
  const b = state.blocks[m.i];
  if (!b) return;
  $("#find-count").textContent = (mIdx + 1) + "/" + matches.length;
  activate(b.id, m.at, m.at + m.len);
  const el = blockEls(b.id);
  if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}
function replaceOne(){
  if (mIdx < 0 || !matches[mIdx]) return;
  const m = matches[mIdx], r = $("#find-r").value;
  const b = state.blocks[m.i];
  if (!b) return;
  b.src = b.src.slice(0, m.at) + r + b.src.slice(m.at + m.len);
  state.activeId = null;
  repaint(b.id);
  touch(true);
  runFind();
}
function replaceAll(){
  const re = findRegex();
  if (!re) return;
  commit();
  const r = $("#find-r").value;
  let n = 0;
  state.blocks.forEach(b => {
    b.src = b.src.replace(re, m => { n++; return r; });
  });
  renderAll();
  touch(true);
  runFind();
  toast(n ? "Replaced " + n + " occurrence" + (n === 1 ? "" : "s") : "Nothing to replace");
}
function openFind(on){
  $("#find").classList.toggle("on", on);
  $("#btn-find").classList.toggle("on", on);
  if (on) { $("#find-q").focus(); $("#find-q").select(); } else { matches = []; mIdx = -1; }
}

function insertBlockAfter(src){
  const idx = state.activeId != null ? blockIndex(state.activeId) : state.blocks.length - 1;
  commit();
  const nb = mkBlock(src);
  const at = Math.min(idx + 1, state.blocks.length);
  state.blocks.splice(at, 0, nb);
  renderAll();
  activate(nb.id, src.indexOf("\n") + 1);
}

let palSel = 0, palList = [];
function openPalette(){
  $("#palette").classList.add("on");
  $("#pal-q").value = "";
  fillPalette("");
  $("#pal-q").focus();
}
function closePalette(){ $("#palette").classList.remove("on"); }
function fillPalette(q){
  const s = q.toLowerCase();
  palList = COMMANDS.filter(c => c.name.toLowerCase().includes(s));
  palSel = 0;
  const list = $("#pal-list");
  list.textContent = "";
  palList.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "opt" + (i === 0 ? " sel" : "");
    d.innerHTML = "<span>" + esc(c.name) + '</span><span class="k">' + esc(c.key) + "</span>";
    d.onmouseenter = () => { palSel = i; markPalette(); };
    d.onclick = () => { closePalette(); c.run(); };
    list.appendChild(d);
  });
}
function markPalette(){
  Array.from($("#pal-list").children).forEach((el, i) => el.classList.toggle("sel", i === palSel));
}
$("#pal-q").addEventListener("input", e => fillPalette(e.target.value));
$("#pal-q").addEventListener("keydown", e => {
  if (e.key === "Escape") { closePalette(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(palSel + 1, palList.length - 1); markPalette(); scrollPal(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(palSel - 1, 0); markPalette(); scrollPal(); }
  else if (e.key === "Enter") { e.preventDefault(); const c = palList[palSel]; closePalette(); if (c) c.run(); }
});
function scrollPal(){
  const el = $("#pal-list").children[palSel];
  if (el) el.scrollIntoView({ block: "nearest" });
}
$("#palette").addEventListener("mousedown", e => { if (e.target.id === "palette") closePalette(); });

/* ---- global keys -------------------------------------------------------- */
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) {
    if (e.key === "Escape" && $("#find").classList.contains("on")) openFind(false);
    return;
  }
  const k = e.key.toLowerCase();
  if (k === "p" && !e.shiftKey && !e.altKey) { e.preventDefault(); $("#palette").classList.contains("on") ? closePalette() : openPalette(); }
  else if (k === "n") { e.preventDefault(); cmdNew(); }
  else if (k === "o") { e.preventDefault(); cmdOpen(); }
  else if (k === "s") { e.preventDefault(); cmdSave(e.shiftKey); }
  else if (k === "f" && e.shiftKey) { e.preventDefault(); toggleFocus(); }
  else if (k === "f") { e.preventDefault(); openFind(true); }
  else if (k === "/") { e.preventDefault(); toggleSource(); }
  else if (k === "\\") { e.preventDefault(); toggleSidebar(); }
  else if (e.key === ",") { e.preventDefault(); settingsDialog(); }
});

/* ---- drag & drop -------------------------------------------------------- */
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("#drop").classList.add("on"); });
window.addEventListener("dragover",  e => e.preventDefault());
window.addEventListener("dragleave", e => { if (--dragDepth <= 0) { dragDepth = 0; $("#drop").classList.remove("on"); } });
window.addEventListener("drop", async e => {
  e.preventDefault();
  dragDepth = 0;
  $("#drop").classList.remove("on");
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (/^image\//.test(f.type)) {
    const fr = new FileReader();
    fr.onload = () => insertBlockAfter("![" + f.name + "](" + fr.result + ")");
    fr.readAsDataURL(f);
    return;
  }
  if (!(await guardUnsaved())) return;
  if (e.dataTransfer.items && e.dataTransfer.items[0].getAsFileSystemHandle) {
    try { state.handle = await e.dataTransfer.items[0].getAsFileSystemHandle(); } catch (err) { state.handle = null; }
  }
  adoptDocument(await f.text(), f.name, state.handle);
  toast("Opened " + f.name);
});

window.addEventListener("beforeunload", e => {
  commit();
  persist();
  if (state.dirty && state.handle) { e.preventDefault(); e.returnValue = ""; }
});

(function boot(){
 try {
  try { Object.assign(prefs, JSON.parse(LS.get("inkwell:prefs") || "{}")); } catch (err) {}
  setTheme(prefs.theme || "paper");

  /* #theme=night lets a page that embeds this file match its own colours,
     without overwriting whatever theme this visitor chose for themselves */
  const wanted = new URLSearchParams(location.hash.slice(1)).get("theme");
  if (wanted && ["paper", "sepia", "night", "slate"].includes(wanted)) {
    prefs.theme = wanted;
    document.documentElement.dataset.theme = wanted;
    $$(".theme-dot").forEach(d => d.classList.toggle("on", d.dataset.theme === wanted));
  }
  toggleSidebar(prefs.sidebar !== false);
  if (prefs.focus)      { prefs.focus = false; toggleFocus(); }
  if (prefs.typewriter) { prefs.typewriter = false; toggleTypewriter(); }
  if (prefs.wide)       { prefs.wide = false; toggleWide(); }
  prefs.source = false;

  const doc = LS.get("inkwell:doc");

  $("#tree").innerHTML = hasFSA
    ? '<div class="side-empty">No folder open yet.</div>'

 } catch (err) {

   touch(false);
 }
})();

<div id="modal"><div class="sheet">

<script>
/* ===========================================================================
   4. IN-APP DIALOGS  (no window.confirm / alert / prompt anywhere)
   =========================================================================== */
const modal = {
  root: document.getElementById("modal"),
  sheet: document.querySelector("#modal .sheet"),
  title: document.getElementById("modal-title"),
  content: document.getElementById("modal-content"),
  actions: document.getElementById("modal-actions"),
  resolve: null,
  lastFocus: null
};

function closeModal(value){
  if (!modal.resolve) return;
  const done = modal.resolve;
  modal.resolve = null;
  modal.root.classList.remove("on");
  modal.content.textContent = "";
  modal.actions.textContent = "";
  if (modal.lastFocus && document.contains(modal.lastFocus)) {
    try { modal.lastFocus.focus(); } catch (e) {}
  }
  done(value);
}

/* dialog({title, message, fields, buttons, choices, wide, cancelValue}) -> Promise */
function dialog(opt){
  if (modal.resolve) closeModal(opt.cancelValue === undefined ? null : opt.cancelValue);
  modal.lastFocus = document.activeElement;
  modal.sheet.classList.toggle("wide", !!opt.wide);
  modal.title.textContent = opt.title || "";
  modal.title.style.display = opt.title ? "" : "none";
  modal.content.textContent = "";
  modal.actions.textContent = "";

  if (opt.message) {
    const p = document.createElement("div");
    p.className = "msg";
    p.textContent = opt.message;
    modal.content.appendChild(p);
  }

  const inputs = {};

  if (opt.choices) {
    const wrap = document.createElement("div");
    wrap.className = "choices list-scroll";
    opt.choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.className = "choice" + (i === 0 ? " sel" : "");
      b.innerHTML = '<span class="ico">' + (c.icon || "•") + "</span>";
      const t = document.createElement("span");
      t.className = "txt";
      t.appendChild(Object.assign(document.createElement("span"), { textContent: c.label }));
      if (c.detail) t.appendChild(Object.assign(document.createElement("small"), { textContent: c.detail }));
      b.appendChild(t);
      b.onclick = () => closeModal(c.value);
      wrap.appendChild(b);
    });
    modal.content.appendChild(wrap);
  }

  if (opt.fields) {
    const wrap = document.createElement("div");
    wrap.className = "fields";
    for (const f of opt.fields) {
      const lab = document.createElement("label");
      if (f.type === "checkbox" || f.type === "range") lab.className = "row";
      const span = document.createElement("span");
      span.textContent = f.label;
      let input;
      if (f.type === "select") {
        input = document.createElement("select");
        (f.options || []).forEach(o => {
          const op = document.createElement("option");
          op.value = o.value; op.textContent = o.label;
          if (String(o.value) === String(f.value)) op.selected = true;
          input.appendChild(op);
        });
      } else if (f.type === "textarea") {
        input = document.createElement("textarea");
        input.value = f.value || "";
        input.spellcheck = false;
      } else {
        input = document.createElement("input");
        input.type = f.type || "text";
        if (f.type === "checkbox") input.checked = !!f.value;
        else input.value = f.value == null ? "" : f.value;
        if (f.min != null) input.min = f.min;
        if (f.max != null) input.max = f.max;
        if (f.step != null) input.step = f.step;
        if (f.placeholder) input.placeholder = f.placeholder;
      }
      inputs[f.name] = input;
      if (f.type === "checkbox") { lab.appendChild(input); lab.appendChild(span); }
      else if (f.type === "range") {
        const out = document.createElement("span");
        out.className = "hint";
        out.textContent = f.value + (f.unit || "");
        input.oninput = () => { out.textContent = input.value + (f.unit || ""); if (f.live) f.live(input.value); };
        lab.appendChild(span); lab.appendChild(input); lab.appendChild(out);
      } else { lab.appendChild(span); lab.appendChild(input); }
      if (f.hint) {
        const h = document.createElement("span");
        h.className = "hint"; h.textContent = f.hint;
        lab.appendChild(h);
      }
      wrap.appendChild(lab);
    }
    modal.content.appendChild(wrap);
  }

  const readValues = () => {
    const v = {};
    for (const k in inputs) v[k] = inputs[k].type === "checkbox" ? inputs[k].checked : inputs[k].value;
    return v;
  };

  (opt.buttons || []).forEach(b => {
    if (b.spacer) { modal.actions.appendChild(Object.assign(document.createElement("span"), { className: "spacer" })); return; }
    const el = document.createElement("button");
    el.textContent = b.label;
    if (b.primary) el.className = "primary";
    if (b.danger) el.className = "danger";
    el.onclick = () => closeModal(opt.fields && b.value !== "cancel" && b.value != null
      ? Object.assign({ action: b.value }, readValues())
      : b.value);
    modal.actions.appendChild(el);
  });

  modal.root.classList.add("on");
  const first = Object.values(inputs)[0] || modal.actions.querySelector(".primary") || modal.content.querySelector(".choice");
  if (first) { first.focus(); if (first.select) first.select(); }

  return new Promise(res => { modal.resolve = res; });
}

modal.root.addEventListener("mousedown", e => {
  if (e.target === modal.root) closeModal(null);
});
modal.root.addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeModal(null); return; }
  if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
    const p = modal.actions.querySelector(".primary");
    if (p) { e.preventDefault(); p.click(); }
  }
  if (modal.content.querySelector(".choice") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const list = Array.from(modal.content.querySelectorAll(".choice"));
    let i = list.findIndex(x => x.classList.contains("sel"));
    i = Math.max(0, Math.min(list.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    list.forEach(x => x.classList.remove("sel"));
    list[i].classList.add("sel");
    list[i].focus();
  }
});

/* --- the three replacements for the browser primitives ------------------- */
const say = (message, title) => dialog({
  title: title || "Inkwell", message,
  buttons: [{ label: "OK", value: true, primary: true }]
});

const ask = (message, opt = {}) => dialog({
  title: opt.title || "Are you sure?", message,
  buttons: [
    { label: opt.cancel || "Cancel", value: false },
    { label: opt.ok || "Continue", value: true, primary: !opt.danger, danger: opt.danger }
  ]
}).then(v => v === true);

const askText = (message, value, opt = {}) => dialog({
  title: opt.title || "Inkwell", message,
  fields: [{ name: "value", label: opt.label || "", value: value || "", placeholder: opt.placeholder }],
  buttons: [{ label: "Cancel", value: "cancel" }, { label: opt.ok || "OK", value: "ok", primary: true }]
}).then(r => (r && r.action === "ok" ? r.value : null));

/* --- unsaved-work guard: three real choices, not confirm's two ----------- */
async function guardUnsaved(){
  if (!state.dirty) return true;
  const r = await dialog({
    title: "Unsaved changes",
    message: state.name + " has changes you have not written to disk. Your draft is kept in this browser either way.",
    buttons: [
      { label: "Discard", value: "discard", danger: true },
      { spacer: true },
      { label: "Cancel", value: "cancel" },
      { label: "Save", value: "save", primary: true }
    ]
  });
  if (r === "save") { await cmdSave(false); return !state.dirty; }
  return r === "discard";
}
</script>

<script>
/* ---- code copy + wiki-link navigation ---------------------------------- */
paper.addEventListener("click", async e => {
  const copy = e.target.closest("pre .copy");
  if (copy) {
    e.preventDefault(); e.stopPropagation();
    const code = copy.closest("pre").dataset.code || "";
    try { await navigator.clipboard.writeText(code); }
    catch (err) {
      const t = document.createElement("textarea");
      t.value = code; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (e2) {}
      t.remove();
    }
    copy.textContent = "copied"; copy.classList.add("done");
    setTimeout(() => { copy.textContent = "copy"; copy.classList.remove("done"); }, 1400);
    return;
  }
  const wiki = e.target.closest("a.wiki");
  if (wiki) {
    e.preventDefault(); e.stopPropagation();
    openWikiPage(wiki.dataset.page);
  }
}, true);

async function openWikiPage(page){
  const want = String(page || "").trim().toLowerCase().replace(/\.md$/, "");
  const hit = fileIndex.find(f => {
    const base = f.label.split("/").pop().replace(/\.[^.]+$/, "").toLowerCase();
    return base === want || f.label.toLowerCase().replace(/\.[^.]+$/, "") === want;
  });
  if (hit) {
    if (!(await guardUnsaved())) return;
    const file = await hit.handle.getFile();
    adoptDocument(await file.text(), file.name, hit.handle);
    toast("Opened " + file.name);
    return;
  }
  const r = await dialog({
    title: "No page called " + page,
    message: fileIndex.length
      ? "Nothing in the open folder matches that name."
      : "Wiki links resolve against an open folder. Open one to link notes together.",
    buttons: fileIndex.length
      ? [{ label: "Cancel", value: null }, { label: "Create it", value: "create", primary: true }]
      : [{ label: "Cancel", value: null }, { label: "Open folder…", value: "folder", primary: true }]
  });
  if (r === "folder") cmdOpenFolder();
  else if (r === "create") createWikiPage(page);
}

async function createWikiPage(page){
  const name = page.replace(/\.md$/i, "") + ".md";
  try {
    const h = await state.dirHandle.getFileHandle(name, { create: true });
    const w = await h.createWritable();
    await w.write("# " + page + "\n\n"); await w.close();
    await buildTree();
    adoptDocument("# " + page + "\n\n", name, h);
    toast("Created " + name);
  } catch (err) { say("Could not create that file: " + err.message, "Write failed"); }
}
</script>

<script>
/* ===========================================================================
   5. WRITING AIDS  — auto-pairing, slash commands, table tools
   =========================================================================== */
Object.assign(prefs, Object.assign({
  fontSize: 17, lineHeight: 1.72, measure: 46, font: "serif",
  lineNumbers: false, autopair: true, smartQuotes: false, spellcheck: true, goal: 0
}, prefs));

const FONTS = {
  serif:  '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif',
  sans:   '-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif',
  mono:   'ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace',
  humanist: 'Optima,Candara,"Gill Sans","Trebuchet MS",sans-serif'
};

function applyPrefs(){
  const r = document.documentElement.style;
  r.setProperty("--font-text", FONTS[prefs.font] || FONTS.serif);
  r.setProperty("--measure", prefs.measure + "rem");
  paper.style.fontSize = prefs.fontSize + "px";
  paper.style.lineHeight = prefs.lineHeight;
  document.body.classList.toggle("hide-spell", !prefs.spellcheck);
  $$(".src").forEach(t => t.spellcheck = !!prefs.spellcheck);
  drawGoal();
}

/* ---- auto-pairing ------------------------------------------------------- */
const PAIRS = { "(": ")", "[": "]", "{": "}", '"': '"', "'": "'", "`": "`", "*": "*", "_": "_", "$": "$", "~": "~" };
const WRAPPERS = new Set(["*", "_", "`", "~", "=", '"', "'", "(", "[", "{", "$"]);

function autoPairKey(e){
  if (slashOpen && handleSlashKey(e)) { e.stopImmediatePropagation(); return; }
  if (!prefs.autopair) return;
  const ta = e.target;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;

  if (e.key === "Backspace" && s === en && s > 0) {         // delete an empty pair whole
    const a = v[s - 1], b = v[s];
    if (PAIRS[a] && PAIRS[a] === b) {
      e.preventDefault(); e.stopImmediatePropagation();
      ta.value = v.slice(0, s - 1) + v.slice(s + 1);
      ta.setSelectionRange(s - 1, s - 1);
      ta.dispatchEvent(new Event("input"));
    }
    return;
  }
  if (e.key.length !== 1) return;

  if (s !== en && WRAPPERS.has(e.key)) {                    // wrap the selection
    e.preventDefault(); e.stopImmediatePropagation();
    const close = PAIRS[e.key] || e.key;
    ta.value = v.slice(0, s) + e.key + v.slice(s, en) + close + v.slice(en);
    ta.setSelectionRange(s + 1, en + 1);
    ta.dispatchEvent(new Event("input"));
    return;
  }
  if (s === en && ")]}".includes(e.key) && v[s] === e.key) { // type through a closer
    e.preventDefault(); e.stopImmediatePropagation();
    ta.setSelectionRange(s + 1, s + 1);
    return;
  }
  if (s === en && "([{".includes(e.key)) {                   // open a pair
    e.preventDefault(); e.stopImmediatePropagation();
    ta.value = v.slice(0, s) + e.key + PAIRS[e.key] + v.slice(s);
    ta.setSelectionRange(s + 1, s + 1);
    ta.dispatchEvent(new Event("input"));
  }
}

/* ---- slash commands ----------------------------------------------------- */
const SLASH = [
  { g: "#",  label: "Heading 1",     insert: "# ",            kind: "line" },
  { g: "#",  label: "Heading 2",     insert: "## ",           kind: "line" },
  { g: "#",  label: "Heading 3",     insert: "### ",          kind: "line" },
  { g: "•",  label: "Bullet list",   insert: "- ",            kind: "line" },
  { g: "1.", label: "Numbered list", insert: "1. ",           kind: "line" },
  { g: "☑",  label: "Task list",     insert: "- [ ] ",        kind: "line" },
  { g: "❝",  label: "Quote",         insert: "> ",            kind: "line" },
  { g: "‹›", label: "Code block",    insert: "```\n\n```",    kind: "block", caret: 4 },
  { g: "⊞",  label: "Table",         insert: "| Column | Column |\n| --- | --- |\n| cell | cell |", kind: "block", caret: 2 },
  { g: "—",  label: "Divider",       insert: "---",           kind: "block" },
  { g: "∑",  label: "Math block",    insert: "$$\n\n$$",      kind: "block", caret: 3 },
  { g: "⤳",  label: "Diagram",       insert: "```mermaid\ngraph TD\n  A[Start] --> B[End]\n```", kind: "block", caret: 12 },
  { g: "☰",  label: "Table of contents", insert: "[TOC]",     kind: "block" },
  { g: "🔗", label: "Link",          insert: "[](url)",       kind: "inline", caret: 1 },
  { g: "🖼",  label: "Image",         insert: "![](url)",      kind: "inline", caret: 2 },
  { g: "⁋",  label: "Footnote",      insert: "[^1]",          kind: "inline" },
  { g: "📅", label: "Today's date",  insert: "",              kind: "inline", dyn: () => new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) },
  { g: "⌚", label: "Timestamp",      insert: "",              kind: "inline", dyn: () => new Date().toLocaleString() },
  { g: "😀", label: "Emoji…",         insert: "",              kind: "emoji" }
];

let slashOpen = false, slashSel = 0, slashItems = [], slashTa = null, slashStart = 0;

function openSlash(ta, start, query){
  slashTa = ta; slashStart = start;
  const q = query.toLowerCase();
  slashItems = SLASH.filter(x => x.label.toLowerCase().includes(q));
  if (q) {
    const emo = Object.keys(EMOJI).filter(k => k.includes(q)).slice(0, 8)
      .map(k => ({ g: EMOJI[k], label: ":" + k + ":", insert: EMOJI[k], kind: "inline" }));
    slashItems = slashItems.concat(emo);
  }
  if (!slashItems.length) return closeSlash();
  slashSel = 0;
  const box = $("#slash");
  box.textContent = "";
  slashItems.forEach((it, i) => {
    const b = document.createElement("button");
    b.className = "si" + (i === 0 ? " sel" : "");
    b.innerHTML = '<span class="g"></span>';
    b.querySelector(".g").textContent = it.g;
    b.appendChild(Object.assign(document.createElement("span"), { textContent: it.label }));
    b.onmousedown = ev => { ev.preventDefault(); runSlash(i); };
    box.appendChild(b);
  });
  const blk = ta.closest(".block");
  const r = blk.getBoundingClientRect();
  box.style.left = Math.min(r.left, window.innerWidth - 268) + "px";
  box.style.top = Math.min(r.bottom + 6, window.innerHeight - 300) + "px";
  box.classList.add("on");
  slashOpen = true;
}
function closeSlash(){ slashOpen = false; $("#slash").classList.remove("on"); }
function markSlash(){
  Array.from($("#slash").children).forEach((el, i) => el.classList.toggle("sel", i === slashSel));
  const el = $("#slash").children[slashSel];
  if (el) el.scrollIntoView({ block: "nearest" });
}
function handleSlashKey(e){
  if (e.key === "Escape")    { closeSlash(); return true; }
  if (e.key === "ArrowDown") { slashSel = (slashSel + 1) % slashItems.length; markSlash(); e.preventDefault(); return true; }
  if (e.key === "ArrowUp")   { slashSel = (slashSel - 1 + slashItems.length) % slashItems.length; markSlash(); e.preventDefault(); return true; }
  if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); runSlash(slashSel); return true; }
  return false;
}
function runSlash(i){
  const it = slashItems[i];
  closeSlash();
  if (!it || !slashTa) return;
  const ta = slashTa;
  const v = ta.value;
  const head = v.slice(0, slashStart);
  const tail = v.slice(ta.selectionStart);
  const text = it.dyn ? it.dyn() : it.insert;

  if (it.kind === "block" && !head.trim() && !tail.trim()) {
    ta.value = text;
    const c = it.caret != null ? (text.split("\n").slice(0, it.caret).join("\n").length || text.length) : text.length;
    ta.setSelectionRange(Math.min(c, text.length), Math.min(c, text.length));
    ta.dispatchEvent(new Event("input"));
    commit();
    return;
  }
  ta.value = head + text + tail;
  const caret = head.length + (it.caret != null && it.kind === "inline" ? it.caret : text.length);
  ta.setSelectionRange(caret, caret);
  ta.dispatchEvent(new Event("input"));
  ta.focus();
}

function slashWatch(ta){
  if (!ta) return closeSlash();
  const pos = ta.selectionStart;
  const line = ta.value.slice(ta.value.lastIndexOf("\n", pos - 1) + 1, pos);
  const m = line.match(/(?:^|\s)\/([\w+-]*)$/);
  if (m) openSlash(ta, pos - m[1].length - 1, m[1]);
  else closeSlash();
}

/* ---- table tools -------------------------------------------------------- */
function tableCells(line){
  return line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
}
function tableToText(rows, align){
  const w = [];
  rows.concat([align.map(a => a)]).forEach(r => r.forEach((c, i) => { w[i] = Math.max(w[i] || 3, String(c).length); }));
  const pad = (c, i) => String(c) + " ".repeat(Math.max(0, w[i] - String(c).length));
  const sep = align.map((a, i) => {
    const n = Math.max(3, w[i]);
    return a === "center" ? ":" + "-".repeat(n - 2) + ":" : a === "right" ? "-".repeat(n - 1) + ":" : a === "left" ? ":" + "-".repeat(n - 1) : "-".repeat(n);
  });
  const out = [ "| " + rows[0].map(pad).join(" | ") + " |", "| " + sep.join(" | ") + " |" ];
  for (let i = 1; i < rows.length; i++) out.push("| " + rows[i].map(pad).join(" | ") + " |");
  return out.join("\n");
}
function readTable(src){
  const lines = src.split("\n").filter(l => l.trim());
  const rows = lines.filter((_, i) => i !== 1).map(tableCells);
  const align = tableCells(lines[1] || "").map(c =>
    /^:.*:$/.test(c) ? "center" : /:$/.test(c) ? "right" : /^:/.test(c) ? "left" : "");
  const cols = Math.max.apply(null, rows.map(r => r.length));
  rows.forEach(r => { while (r.length < cols) r.push(""); });
  while (align.length < cols) align.push("");
  return { rows, align };
}
function caretCell(ta){
  const pos = ta.selectionStart, v = ta.value;
  const lineNo = v.slice(0, pos).split("\n").length - 1;
  const line = v.split("\n")[lineNo] || "";
  const col = (line.slice(0, pos - (v.lastIndexOf("\n", pos - 1) + 1)).match(/\|/g) || []).length - 1;
  const dataRow = lineNo === 0 ? 0 : lineNo === 1 ? 0 : lineNo - 1;
  return { row: Math.max(0, dataRow), col: Math.max(0, col) };
}
function tableOp(op){
  const el = blockEls(state.activeId);
  const ta = el && el.querySelector(".src");
  if (!ta) return;
  const { rows, align } = readTable(ta.value);
  const at = caretCell(ta);
  at.col = Math.max(0, Math.min(at.col, align.length - 1));   // caret can sit past the last cell
  at.row = Math.max(0, Math.min(at.row, rows.length - 1));
  const cols = align.length;
  if (op === "row+")  rows.splice(Math.min(rows.length, at.row + 1), 0, new Array(cols).fill(""));
  if (op === "row-" && rows.length > 2 && at.row > 0) rows.splice(at.row, 1);
  if (op === "col+")  { rows.forEach(r => r.splice(at.col + 1, 0, "")); align.splice(at.col + 1, 0, ""); }
  if (op === "col-" && cols > 1) { rows.forEach(r => r.splice(at.col, 1)); align.splice(at.col, 1); }
  if (op === "left" || op === "center" || op === "right") align[at.col] = op;
  if (op === "none") align[at.col] = "";
  ta.value = tableToText(rows, align);
  const lines = ta.value.split("\n");
  const line = Math.min(lines.length - 1, at.row === 0 ? 0 : at.row + 1);
  const caret = lines.slice(0, line).join("\n").length + (line ? 1 : 0);
  ta.dispatchEvent(new Event("input"));
  ta.focus();
  ta.setSelectionRange(caret, caret);                          // stay on the row we edited
  positionTableTools();
}
function buildTableTools(){
  const bar = $("#tabletools");
  if (bar.children.length) return;
  const add = (label, op, title) => {
    const b = document.createElement("button");
    b.textContent = label; b.title = title || label;
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => tableOp(op);
    bar.appendChild(b);
  };
  add("+ row", "row+", "Add a row below"); add("− row", "row-", "Delete this row");
  bar.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  add("+ col", "col+", "Add a column after"); add("− col", "col-", "Delete this column");
  bar.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  add("⌐", "left", "Align left"); add("≡", "center", "Align centre"); add("¬", "right", "Align right");
}
function positionTableTools(){
  const bar = $("#tabletools");
  const el = state.activeId != null ? blockEls(state.activeId) : null;
  const b = el && state.blocks[blockIndex(state.activeId)];
  if (!el || !b || blockType(b.src) !== "table") { bar.classList.remove("on"); return; }
  buildTableTools();
  const r = el.getBoundingClientRect();
  bar.style.left = r.left + "px";
  bar.style.top = Math.max(48, r.top - 34) + "px";
  bar.classList.add("on");
}

/* ---- writing goal ------------------------------------------------------- */
function drawGoal(){
  const host = $("#goal");
  if (!prefs.goal) { host.style.display = "none"; return; }
  host.style.display = "flex";
  const words = parseInt(($("#st-words").textContent || "0").replace(/[^\d]/g, ""), 10) || 0;
  const pct = Math.min(1, words / prefs.goal);
  const C = 2 * Math.PI * 5.5;
  host.classList.toggle("done", pct >= 1);
  host.innerHTML = '<svg viewBox="0 0 16 16"><circle class="ring-bg" cx="8" cy="8" r="5.5"/>' +
    '<circle class="ring-fg" cx="8" cy="8" r="5.5" stroke-dasharray="' + (C * pct).toFixed(1) + " " + C.toFixed(1) + '"/></svg>' +
    "<span>" + words.toLocaleString() + " / " + prefs.goal.toLocaleString() + "</span>";
  host.title = "Writing goal — click to change";
  host.onclick = settingsDialog;
}

/* ---- settings ----------------------------------------------------------- */
async function settingsDialog(){
  const before = JSON.stringify(prefs);
  const r = await dialog({
    title: "Preferences",
    wide: true,
    fields: [
      { name: "font", label: "Typeface", type: "select", value: prefs.font, options: [
        { value: "serif", label: "Serif — Iowan / Palatino" },
        { value: "sans", label: "Sans — system UI" },
        { value: "humanist", label: "Humanist — Optima / Gill Sans" },
        { value: "mono", label: "Monospace" }
      ] },
      { name: "fontSize", label: "Text size", type: "range", value: prefs.fontSize, min: 13, max: 24, step: 1, unit: "px",
        live: v => { paper.style.fontSize = v + "px"; } },
      { name: "lineHeight", label: "Line height", type: "range", value: prefs.lineHeight, min: 1.3, max: 2.2, step: .02, unit: "",
        live: v => { paper.style.lineHeight = v; } },
      { name: "measure", label: "Column width", type: "range", value: prefs.measure, min: 32, max: 72, step: 1, unit: "rem",
        live: v => document.documentElement.style.setProperty("--measure", v + "rem") },
      { name: "goal", label: "Daily word goal (0 = off)", type: "number", value: prefs.goal, min: 0, max: 100000, step: 50 },
      { name: "autopair", label: "Auto-close brackets and wrap the selection", type: "checkbox", value: prefs.autopair },
      { name: "lineNumbers", label: "Line numbers in code blocks", type: "checkbox", value: prefs.lineNumbers },
      { name: "spellcheck", label: "Check spelling while writing", type: "checkbox", value: prefs.spellcheck }
    ],
    buttons: [{ label: "Cancel", value: "cancel" }, { label: "Apply", value: "ok", primary: true }]
  });
  if (!r || r.action !== "ok") { Object.assign(prefs, JSON.parse(before)); applyPrefs(); return; }
  prefs.font = r.font;
  prefs.fontSize = +r.fontSize;
  prefs.lineHeight = +r.lineHeight;
  prefs.measure = +r.measure;
  prefs.goal = Math.max(0, parseInt(r.goal, 10) || 0);
  prefs.autopair = r.autopair;
  prefs.lineNumbers = r.lineNumbers;
  prefs.spellcheck = r.spellcheck;
  applyPrefs();
  const wasActive = state.activeId;
  commit();
  renderAll();
  if (wasActive != null && blockIndex(wasActive) >= 0) activate(wasActive);
  persist();
}

/* ---- export ------------------------------------------------------------- */
function renderedBody(){
  return state.blocks.map(b => '<div class="block"><div class="rendered">' + renderBlock(b.src) + "</div></div>").join("\n");
}
function exportWord(){
  commit();
  const title = state.name.replace(/\.[^.]+$/, "");
  const css = "body{font-family:Georgia,serif;font-size:12pt;line-height:1.6;margin:2.5cm}" +
    "h1,h2,h3,h4{font-family:Calibri,Arial,sans-serif;color:#1a1a1a}" +
    "pre{background:#f4f4f4;padding:10px;border:1px solid #ddd;font-family:Consolas,monospace;font-size:10pt}" +
    "code{font-family:Consolas,monospace;background:#f4f4f4}" +
    "blockquote{border-left:3px solid #ccc;margin-left:0;padding-left:14px;color:#555}" +
    "table{border-collapse:collapse}td,th{border:1px solid #999;padding:5px 9px}" +
    "img{max-width:100%}";
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
    '<head><meta charset="utf-8"><title>' + esc(title) + "</title><style>" + css + "</style></head><body>" +
    renderedBody().replace(/<div class="block"><div class="rendered">|<\/div><\/div>/g, "") + "</body></html>";
  download(title + ".doc", html, "application/msword");
  toast("Exported for Word");
}
function exportText(){
  commit();
  const tmp = document.createElement("div");
  tmp.innerHTML = renderedBody();
  download(state.name.replace(/\.[^.]+$/, "") + ".txt", tmp.textContent.replace(/\n{3,}/g, "\n\n").trim(), "text/plain");
  toast("Exported plain text");
}
async function exportMenu(){
  const pick = await dialog({
    title: "Export " + state.name,
    choices: [
      { icon: "🌐", label: "HTML page",      detail: "One self-contained file, styles included", value: "html" },
      { icon: "📄", label: "PDF",            detail: "Through your browser's print dialog",      value: "pdf" },
      { icon: "📝", label: "Word (.doc)",     detail: "Opens in Word, Pages and LibreOffice",     value: "doc" },
      { icon: "⤓",  label: "Markdown copy",  detail: "Download the raw .md",                     value: "md" },
      { icon: "🅣",  label: "Plain text",     detail: "Formatting stripped out",                  value: "txt" }
    ],
    buttons: [{ label: "Cancel", value: null }]
  });
  if (pick === "html") exportHTML();
  else if (pick === "pdf") exportPDF();
  else if (pick === "doc") exportWord();
  else if (pick === "md") { commit(); download(state.name, serialize()); toast("Downloaded " + state.name); }
  else if (pick === "txt") exportText();
}

/* ---- rename ------------------------------------------------------------- */
async function renameDoc(){
  const v = await askText("Give this document a new file name.", state.name, { title: "Rename", label: "File name", ok: "Rename" });
  if (!v) return;
  state.name = /\.[a-z0-9]+$/i.test(v) ? v : v + ".md";
  state.dirty = true;
  touch(true);
  toast("Renamed to " + state.name);
}
$("#docname").style.cursor = "text";
$("#docname").title = "Click to rename";
$("#docname").onclick = renameDoc;
$("#btn-prefs").onclick = settingsDialog;
applyPrefs();
</script>

<script>
/* ===========================================================================
   6. DOCUMENTS, VIEWS, HISTORY
   =========================================================================== */

/* ---- tabs --------------------------------------------------------------- */
const docs = [];
let docSeq = 0, curDoc = null;

function snapshotDoc(){
  if (curDoc == null) return;
  commit();
  const d = docs.find(x => x.id === curDoc);
  if (!d) return;
  d.text = serialize(); d.name = state.name; d.handle = state.handle;
  d.dirty = state.dirty; d.scrollTop = scroll.scrollTop;
}

function adoptDocument(text, name, handle){
  snapshotDoc();
  let d = docs.find(x => (handle && x.handle === handle) || (!handle && x.name === name && !x.handle));
  if (d) { d.text = text; d.handle = handle || d.handle; d.dirty = false; }
  else { d = { id: ++docSeq, text, name, handle: handle || null, dirty: false, scrollTop: 0 }; docs.push(d); }
  curDoc = d.id;
  state.handle = d.handle;
  loadText(d.text, d.name);
  renderTabs();
  touch(false);
}

function switchDoc(id){
  if (id === curDoc) return;
  snapshotDoc();
  const d = docs.find(x => x.id === id);
  if (!d) return;
  curDoc = id;
  state.handle = d.handle;
  loadText(d.text, d.name);
  state.dirty = d.dirty;
  renderTabs();
  touch(false);
  requestAnimationFrame(() => { scroll.scrollTop = d.scrollTop || 0; });
}

async function closeDoc(id){
  const i = docs.findIndex(x => x.id === id);
  if (i < 0) return;
  const d = docs[i];
  if (id === curDoc) snapshotDoc();
  if (d.dirty) {
    const r = await dialog({
      title: "Close " + d.name + "?",
      message: "It has changes that are not written to disk.",
      buttons: [
        { label: "Discard", value: "discard", danger: true },
        { spacer: true },
        { label: "Cancel", value: "cancel" },
        { label: "Save", value: "save", primary: true }
      ]
    });
    if (r === "cancel" || r == null) return;
    if (r === "save") { if (id === curDoc) { await cmdSave(false); if (state.dirty) return; } }
  }
  docs.splice(i, 1);
  if (!docs.length) { curDoc = null; renderTabs(); cmdNew(); return; }
  if (id === curDoc) { curDoc = null; switchDoc(docs[Math.max(0, i - 1)].id); }
  renderTabs();
}

function renderTabs(){
  const bar = $("#tabs");
  document.body.classList.toggle("tabbed", docs.length > 1);
  bar.textContent = "";
  docs.forEach(d => {
    const t = document.createElement("button");
    t.className = "tab" + (d.id === curDoc ? " on" : "");
    t.title = d.name;
    const live = d.id === curDoc ? state.dirty : d.dirty;
    if (live) t.appendChild(Object.assign(document.createElement("span"), { className: "dot" }));
    t.appendChild(Object.assign(document.createElement("span"), { className: "nm", textContent: d.name }));
    const x = document.createElement("span");
    x.className = "cl"; x.textContent = "×";
    x.onclick = e => { e.stopPropagation(); closeDoc(d.id); };
    t.appendChild(x);
    t.onclick = () => switchDoc(d.id);
    bar.appendChild(t);
  });
  const plus = document.createElement("button");
  plus.className = "newtab"; plus.textContent = "+"; plus.title = "New document (⌘N)";
  plus.onclick = () => cmdNew();
  bar.appendChild(plus);
}

/* new documents and opened files become tabs instead of replacing the buffer */
cmdNew = function(){
  adoptDocument("# Untitled\n\n", "Untitled " + (docs.length + 1) + ".md", null);
  state.name = "Untitled.md";
  touch(false);
  renderTabs();
  if (state.blocks[0]) activate(state.blocks[0].id);
};

/* ---- split view --------------------------------------------------------- */
let splitTimer = null;
function toggleSplit(){
  prefs.split = !prefs.split;
  const on = prefs.split;
  if (on && prefs.source) toggleSource();
  document.body.classList.toggle("mode-split", on);
  $("#btn-split").classList.toggle("on", on);
  if (on) {
    commit();
    $("#split-src").value = serialize();
    paintSplit();
    $("#split-src").focus();
  } else {
    loadText($("#split-src").value, state.name);
    state.dirty = true;
    touch(true);
  }
  persist();
}
function paintSplit(){
  $("#split-prev").innerHTML = '<div class="rendered">' + renderDoc($("#split-src").value) + "</div>";
}

/* ---- presentation ------------------------------------------------------- */
let slides = [], slideAt = 0;
function startPresentation(){
  commit();
  const text = serialize();
  slides = text.split(/\n\s*-{3,}\s*\n/).map(s => s.trim()).filter(Boolean);
  if (slides.length < 2) slides = text.split(/\n(?=#\s)/).map(s => s.trim()).filter(Boolean);
  if (!slides.length) return say("There is nothing to present yet.", "Empty document");
  slideAt = 0;
  $("#present").classList.add("on");
  drawSlide();
  document.addEventListener("keydown", presentKeys, true);
  const el = $("#present");
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
function endPresentation(){
  $("#present").classList.remove("on");
  document.removeEventListener("keydown", presentKeys, true);
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
function drawSlide(){
  const pct = ((slideAt + 1) / slides.length) * 100;
  $("#present").innerHTML =
    '<div class="prog" style="width:' + pct + '%"></div>' +
    '<div class="slide"><div class="rendered">' + renderDoc(slides[slideAt]) + "</div></div>" +
    '<div class="bar"><span>' + (slideAt + 1) + " / " + slides.length + "</span>" +
    '<span class="grow"></span><span>← → to move · Esc to leave</span>' +
    '<button id="pres-prev">Prev</button><button id="pres-next">Next</button>' +
    '<button id="pres-exit">Exit</button></div>';
  $("#pres-prev").onclick = () => move(-1);
  $("#pres-next").onclick = () => move(1);
  $("#pres-exit").onclick = endPresentation;
}
function move(d){
  slideAt = Math.max(0, Math.min(slides.length - 1, slideAt + d));
  drawSlide();
}
function presentKeys(e){
  if (e.key === "Escape") { e.preventDefault(); endPresentation(); }
  else if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); move(1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); move(-1); }
  else if (e.key === "Home") { e.preventDefault(); slideAt = 0; drawSlide(); }
  else if (e.key === "End") { e.preventDefault(); slideAt = slides.length - 1; drawSlide(); }
  e.stopPropagation();
}

/* ---- version history ---------------------------------------------------- */
const HIST_KEY = "inkwell:history", HIST_MAX = 40;
function readHistory(){
  try { return JSON.parse(LS.get(HIST_KEY) || "[]"); } catch (e) { return []; }
}
function snapshotHistory(reason){
  const text = serialize();
  if (!text.trim()) return;
  const all = readHistory();
  const last = all.find(h => h.name === state.name);
  if (last && last.text === text) return;
  all.unshift({ t: Date.now(), name: state.name, reason: reason || "auto", text });
  let trimmed = all.slice(0, HIST_MAX);
  while (trimmed.length > 1 && JSON.stringify(trimmed).length > 900000) trimmed = trimmed.slice(0, trimmed.length - 1);
  LS.set(HIST_KEY, JSON.stringify(trimmed));
}
setInterval(() => { if (state.dirty) snapshotHistory("auto"); }, 5 * 60 * 1000);

async function historyDialog(){
  const all = readHistory();
  if (!all.length) return say("No snapshots yet. Inkwell keeps one every five minutes while you write, and one each time you save.", "Version history");
  const fmt = t => {
    const d = new Date(t), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return (sameDay ? "Today " : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " ") +
           d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  const pick = await dialog({
    title: "Version history",
    wide: true,
    choices: all.slice(0, 24).map((h, i) => ({
      icon: h.reason === "save" ? "💾" : "🕘",
      label: fmt(h.t) + " · " + h.name,
      detail: (h.text.match(/\S+/g) || []).length + " words · " + h.text.trim().split("\n")[0].replace(/^#+\s*/, "").slice(0, 52),
      value: i
    })),
    buttons: [{ label: "Close", value: null }]
  });
  if (pick == null) return;
  const h = all[pick];
  const what = await dialog({
    title: "Restore this version?",
    message: fmt(h.t) + " — " + (h.text.match(/\S+/g) || []).length + " words.",
    buttons: [
      { label: "Cancel", value: null },
      { label: "Open in a new tab", value: "tab" },
      { label: "Replace current", value: "replace", primary: true }
    ]
  });
  if (what === "tab") adoptDocument(h.text, h.name.replace(/\.md$/, "") + " (restored).md", null);
  else if (what === "replace") { loadText(h.text, state.name); state.dirty = true; touch(true); toast("Restored " + fmt(h.t)); }
}

/* ---- tags & links pane -------------------------------------------------- */
function buildTags(){
  const host = $("#pane-tags");
  const text = serialize();
  const counts = new Map();
  const re = /(^|[\s(])#([A-Za-z][\w/-]{0,40})/g;
  let m;
  while ((m = re.exec(text))) counts.set(m[2], (counts.get(m[2]) || 0) + 1);

  const links = new Set();
  const lre = /\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g;
  while ((m = lre.exec(text))) links.add(m[1].trim());

  host.textContent = "";
  const h = t => host.appendChild(Object.assign(document.createElement("div"), { className: "side-h", textContent: t }));

  h("Tags in this document");
  if (!counts.size) host.appendChild(Object.assign(document.createElement("div"), { className: "side-empty", textContent: "Write #like-this to tag a note." }));
  else {
    const row = document.createElement("div");
    row.className = "tagrow";
    Array.from(counts.entries()).sort((a, b) => b[1] - a[1]).forEach(([tag, n]) => {
      const c = document.createElement("button");
      c.className = "tagchip";
      c.textContent = "#" + tag;
      c.appendChild(Object.assign(document.createElement("b"), { textContent: n }));
      c.onclick = () => { openFind(true); $("#find-q").value = "#" + tag; runFind(); };
      row.appendChild(c);
    });
    host.appendChild(row);
  }

  h("Links out");
  if (!links.size) host.appendChild(Object.assign(document.createElement("div"), { className: "side-empty", textContent: "Use [[Note name]] to link documents." }));
  else links.forEach(page => {
    const b = document.createElement("button");
    b.className = "tree-item";
    b.textContent = "→ " + page;
    b.onclick = () => openWikiPage(page);
    host.appendChild(b);
  });

  h("Links in");
  const btn = document.createElement("button");
  btn.className = "side-action";
  btn.textContent = fileIndex.length ? "Scan folder for backlinks" : "Open a folder to find backlinks";
  btn.onclick = () => fileIndex.length ? scanBacklinks() : cmdOpenFolder();
  host.appendChild(btn);
}

async function scanBacklinks(){
  const me = state.name.replace(/\.[^.]+$/, "").toLowerCase();
  const hits = [];
  for (const f of fileIndex) {
    if (f.label.replace(/\.[^.]+$/, "").toLowerCase() === me) continue;
    try {
      const txt = await (await f.handle.getFile()).text();
      const re = /\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g;
      let m;
      while ((m = re.exec(txt))) {
        if (m[1].trim().toLowerCase() === me) { hits.push(f); break; }
      }
    } catch (err) {}
  }
  if (!hits.length) return say("Nothing in this folder links to " + state.name + " yet.", "No backlinks");
  const pick = await dialog({
    title: "Linked from",
    choices: hits.map((f, i) => ({ icon: "↩", label: f.label, value: i })),
    buttons: [{ label: "Close", value: null }]
  });
  if (pick == null) return;
  if (!(await guardUnsaved())) return;
  const file = await hits[pick].handle.getFile();
  adoptDocument(await file.text(), file.name, hits[pick].handle);
}
</script>


<script>
/* ---- final wiring ------------------------------------------------------- */
$("#btn-split").onclick   = () => toggleSplit();
$("#btn-present").onclick = () => startPresentation();
$("#btn-hist").onclick    = () => historyDialog();
$("#split-src").addEventListener("input", () => {
  state.dirty = true;
  clearTimeout(splitTimer);
  splitTimer = setTimeout(() => { paintSplit(); LS.set("inkwell:doc", $("#split-src").value); }, 220);
});

function cycleTab(d){
  if (docs.length < 2) return;
  const i = docs.findIndex(x => x.id === curDoc);
  switchDoc(docs[(i + d + docs.length) % docs.length].id);
}
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "w") { e.preventDefault(); if (curDoc != null) closeDoc(curDoc); }
  else if (k === "t") { e.preventDefault(); cmdNew(); }
  else if (e.key === "Tab") { e.preventDefault(); cycleTab(e.shiftKey ? -1 : 1); }
  else if (k === "h" && e.shiftKey) { e.preventDefault(); historyDialog(); }
  else if (/^[1-9]$/.test(k) && docs.length > 1) {
    const d = docs[+k - 1];
    if (d) { e.preventDefault(); switchDoc(d.id); }
  }
});

/* tag chips jump to a search */
paper.addEventListener("click", e => {
  const tag = e.target.closest("a.tag");
  if (!tag) return;
  e.preventDefault(); e.stopPropagation();
  openFind(true);
  $("#find-q").value = "#" + tag.dataset.tag;
  runFind();
}, true);

/* the document that booted becomes the first tab */
if (!docs.length) {
  docs.push({ id: ++docSeq, text: serialize(), name: state.name, handle: null, dirty: false, scrollTop: 0 });
  curDoc = docs[0].id;
  renderTabs();
}
buildTags();
</script>

</body>
